<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Delight Motion</title>
<style>

:root{
  --ink:#1a1a1a; --ink-2:#5c5c5c; --ink-3:#8f8f8f;
  --line:#e6e6e6; --line-2:#cfcfcf;
  --bg:#f5f5f4; --panel:#fff; --sub:#fafaf9;
  --aia:#d31145; --aia-bg:#fdeef2; --aia-line:#f3c3d0;
  --warn:#8a5a00; --warn-bg:#fdf3e0; --warn-line:#f0dcb2;
  --ok:#1f6b3f; --ok-bg:#eef7f1; --ok-line:#c3e0ce;
  --font:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}




.chrome{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);flex:0 0 auto}
.chrome b{font-size:11px;font-weight:600}
.chrome .sp{margin-left:auto;font-size:10px;color:var(--ink-3)}
.body{padding:12px;flex:1 1 auto;overflow-y:auto}
.foot{padding:10px 12px;border-top:1px solid var(--line);display:flex;gap:6px;flex:0 0 auto}

button{font-family:var(--font);font-size:11px;padding:7px 10px;border-radius:6px;
  border:1px solid var(--line-2);background:var(--panel);color:var(--ink);cursor:pointer}
button:hover{background:var(--sub)}
button.primary{background:var(--aia);border-color:var(--aia);color:#fff}
button.primary:hover{opacity:.9}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,select:focus-visible{outline:2px solid var(--aia);outline-offset:2px}
.link{border:0;background:none;color:var(--ink-3);font-size:10px;padding:0;text-decoration:underline}
.link:hover{color:var(--aia);background:none}
select{font-family:var(--font);font-size:11px;border:1px solid var(--line-2);border-radius:6px;
  padding:7px;background:var(--panel);color:var(--ink);width:100%}

h3{font-size:14px;font-weight:600;margin-bottom:3px}
.lede{font-size:11px;color:var(--ink-2);line-height:1.55;margin-bottom:12px}
.note{font-size:10px;color:var(--ink-3);line-height:1.55}
.sec{font-size:9.5px;color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase;
  margin:16px 0 7px;padding-bottom:4px;border-bottom:1px solid var(--line)}

.diag{background:var(--aia-bg);border:1px solid var(--aia-line);border-radius:8px;padding:12px;margin-bottom:10px}
.diag .k{font-size:9.5px;color:var(--aia);letter-spacing:.04em;text-transform:uppercase;margin-bottom:3px}
.diag h2{font-size:17px;font-weight:600;color:var(--ink);margin-bottom:4px}
.diag p{font-size:11px;color:var(--ink-2);line-height:1.5}
.evi{font-size:10px;color:var(--ink-2);line-height:1.6;padding-left:14px;position:relative;margin-bottom:4px}
.evi:before{content:"";position:absolute;left:3px;top:7px;width:4px;height:4px;border-radius:50%;background:var(--aia-line)}

.rule{display:flex;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:10.5px;line-height:1.5}
.rule .ic{flex:0 0 15px;text-align:center;font-size:11px}
.rule.yes .ic{color:var(--ok)} .rule.no .ic{color:var(--warn)}
.rule.found .ic{color:var(--aia)} .rule.always .ic{color:var(--ink-3)}
.rule b{font-weight:600;display:block}
.rule span.d{color:var(--ink-2);display:block;margin-top:2px}

.erow{width:100%;text-align:left;display:flex;align-items:center;gap:8px;padding:10px;
  border:1px solid var(--line-2);border-radius:7px;margin-bottom:6px;background:var(--panel);
  cursor:pointer;font-family:var(--font)}
.erow:hover{border-color:var(--ink-3)}
.erow .nm{font-size:11.5px;font-weight:500}
.erow .st{font-size:10px;color:var(--ink-3);display:block;margin-top:2px;font-weight:400}
.erow .chev{color:var(--ink-3);font-size:12px}
.erow.done{border-color:var(--ok-line);background:var(--ok-bg)}
.pill{font-size:8.5px;padding:1px 6px;border-radius:99px;white-space:nowrap;
  background:var(--aia-bg);color:var(--aia);border:1px solid var(--aia-line)}
.pill.g{background:var(--sub);color:var(--ink-3);border-color:var(--line-2)}
.pill.k{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-line)}

.opt{border:1px solid var(--line-2);border-radius:8px;margin-bottom:9px;overflow:hidden;cursor:pointer}
.opt.on{border-color:var(--aia);box-shadow:0 0 0 1px var(--aia)}
.opt-h{display:flex;align-items:center;gap:8px;padding:9px 10px}
.opt-h .nm{flex:1;font-size:12px;font-weight:600}
.opt-s{font-size:10px;color:var(--ink-2);padding:0 10px 8px;line-height:1.5}
.pv{height:62px;background:var(--sub);border-top:1px solid var(--line);display:flex;
  align-items:center;justify-content:center;gap:5px;overflow:hidden}
.sq{width:28px;height:28px;border-radius:5px;background:var(--aia)}
.bar{width:9px;height:28px;border-radius:3px;background:var(--aia)}
.tick{width:34px;height:34px;border-radius:50%;border:2.5px solid var(--aia);position:relative}
.tick i{position:absolute;left:8px;top:15px;width:15px;height:7px;border-left:2.5px solid var(--aia);
  border-bottom:2.5px solid var(--aia);transform:rotate(-45deg);transform-origin:left bottom}
.opt-b{padding:10px;border-top:1px solid var(--line);font-size:10.5px}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:10px;padding:4px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv code{font-family:var(--mono);font-size:9.5px}
.new{font-size:8px;border:1px solid var(--line-2);border-radius:3px;padding:0 3px;margin-left:4px;color:var(--ink-3)}
textarea{width:100%;font-family:var(--mono);font-size:9.5px;line-height:1.6;border:1px solid var(--line-2);
  border-radius:6px;padding:8px;background:var(--sub);color:var(--ink);resize:vertical;min-height:96px;margin-top:8px}
.flag{border-radius:6px;padding:9px 10px;font-size:10.5px;line-height:1.5;margin-bottom:9px}
.flag.warn{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn)}
.flag.lib{background:var(--ok-bg);border:1px solid var(--ok-line);color:var(--ok)}
.flag b{display:block;margin-bottom:2px}
.spin{width:12px;height:12px;border:2px solid var(--line-2);border-top-color:var(--aia);
  border-radius:50%;display:inline-block;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation:none}}


.libcard{display:flex;gap:10px;align-items:center;border:1px solid var(--ok-line);background:var(--ok-bg);
  border-radius:8px;padding:10px;margin-bottom:9px}
.libcard .ico{width:44px;height:44px;border-radius:8px;background:var(--panel);border:1px solid var(--ok-line);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.libcard .t{flex:1;font-size:11px;line-height:1.5}
.libcard code{font-family:var(--mono);font-size:9.5px;color:var(--ok)}
.stagebar{display:flex;align-items:center;gap:7px;padding:8px 10px;border:1px solid var(--aia-line);
  background:var(--aia-bg);border-radius:7px;margin-bottom:12px}
.stagebar .k{font-size:9.5px;color:var(--aia);text-transform:uppercase;letter-spacing:.04em}
.stagebar b{flex:1;font-size:11.5px;color:var(--ink)}
.stagebar .link{color:var(--aia)}
.flag.main{background:var(--aia-bg);border:1px solid var(--aia-line);color:var(--aia)}
.flag.none{background:var(--sub);border:1px solid var(--line);color:var(--ink-2)}
.volwrap{background:var(--sub);border-radius:6px;padding:9px 10px}
.volhead{display:flex;justify-content:space-between;font-size:10px;color:var(--ink-3);margin-bottom:7px}
.volhead span:first-child{color:var(--ink);font-weight:600}
.volrow{display:flex;align-items:center;gap:8px;font-size:9.5px;color:var(--ink-3);margin-bottom:4px}
.volrow>span:first-child{flex:0 0 74px}
.voltrack{flex:1;height:3px;border-radius:2px;background:var(--line-2);overflow:hidden}
.volfill{display:block;height:3px;border-radius:2px;background:var(--aia)}
.volnum{flex:0 0 10px;text-align:right;font-size:9px;color:var(--ink-3)}
.voltotal{position:relative;height:6px;border-radius:3px;background:var(--line-2);margin-bottom:7px}
.voltotalfill{display:block;height:6px;border-radius:3px;background:var(--aia)}
.voltarget{position:absolute;top:-3px;width:2px;height:12px;border-radius:1px;background:var(--ink);margin-left:-1px}
.volfit{font-size:9.5px;color:var(--warn);line-height:1.5;margin:0 0 9px}
.volfit.ok{color:var(--ink-3)}
.iconpv{display:inline-block;width:40px;height:40px;color:var(--aia)}
.iconpv svg{width:100%;height:100%;display:block}
.libcard .iconpv{width:34px;height:34px}
.ecard{border:1px solid var(--line-2);border-radius:8px;margin-bottom:7px;overflow:hidden;background:var(--panel)}
.ecard.done{border-color:var(--ok-line);background:var(--ok-bg)}
.ehead{display:flex;align-items:flex-start;gap:8px;padding:9px 10px 7px}
.ehead .nm{font-size:11.5px;font-weight:500}
.ehead .st{display:block;font-size:10px;color:var(--ink-3);margin-top:2px}
.eact{display:flex;gap:5px;padding:0 10px 9px}
.mini{flex:1;font-size:10px;padding:6px 8px}
.mini.go{background:var(--aia);border-color:var(--aia);color:#fff}
.ecard.done .mini.go{background:var(--ok);border-color:var(--ok)}

/* --- plugin host --- */
body{margin:0;background:var(--panel);font-family:var(--font);color:var(--ink);
  height:100vh;display:flex;flex-direction:column;overflow:hidden}
.chrome button#gear{border:0;background:none;padding:2px 4px;font-size:13px;line-height:1;color:var(--ink-3)}
.chrome button#gear:hover{color:var(--ink)}
.keyfield{width:100%;font-family:var(--mono);font-size:10.5px;border:1px solid var(--line-2);
  border-radius:6px;padding:8px;background:var(--panel);color:var(--ink)}
.flag.neutral{background:var(--sub);border:1px solid var(--line);color:var(--ink-2)}
.flag code{font-family:var(--mono);font-size:10px}
.steps{font-size:10.5px;color:var(--ink-2);line-height:1.7;padding-left:16px}
.q{font-size:11.5px;margin-bottom:5px;font-weight:500}

</style>
</head>
<body>
  <div class="chrome">
    <b id="ttl">Delight Motion</b>
    <span class="sp" id="stp"></span>
    <button id="gear" title="Settings" aria-label="Settings">&#9881;</button>
  </div>
  <div class="body" id="body"></div>
  <div class="foot" id="foot"></div>

<script>
/* tokens.js — Qi motion tokens, plus the easing curves measured from the
   animated icons in the Qi library. Change a value here and every pattern
   and verb that uses it picks it up. Do not edit anything outside src/data. */

window.DUR = {
  "stagger-tight":      { ms:60,  u:"Sibling offset in a layout. Rows, chips, cards." },
  "stagger-parts":      { ms:220, u:"Sub-part offset inside one icon. Measured from the watch rings and the target." },
  "duration-instant":   { ms:100, u:"Anything finger-caused. Micro-feedback such as a button press." },
  "duration-fast":      { ms:200, u:"Small elements. Chips, row entrances, icon swaps." },
  "duration-moderate":  { ms:300, u:"Larger surfaces, roughly half the phone width or a third of its height and up." },
  "duration-slow":      { ms:500, u:"A single element carrying a stage on its own, where slowness reads as composure." },
  "duration-deliberate":{ ms:700, u:"Unused so far. Guidelines will come as more journeys are delighted." },
  "duration-icon":      { ms:800, u:"An icon completing its full gesture. Measured from the success check." },
  "duration-loop":      { ms:2200,u:"One cycle of a continuous icon. Every animated icon in the library uses this." }
};

window.EAS = {
  "ease-out":    { c:"cubic-bezier(0,0,.58,1)",   d:"Entrances. Decelerates into place. The default." },
  "ease-in":     { c:"cubic-bezier(.42,0,1,1)",   d:"Exits. Accelerates away." },
  "ease-in-out": { c:"cubic-bezier(.42,0,.58,1)", d:"Motion that both starts and ends on screen." },
  "linear":      { c:"cubic-bezier(0,0,1,1)",     d:"Non-physical motion only. Nothing with mass moves at a constant speed." },
  "ease-settle": { c:"cubic-bezier(.34,1.4,.64,1)", d:"Arrival. Something coming to rest after being placed." },

  /* Measured from the animated icons. These are the curves the library
     already uses, so an icon built with them matches what exists. */
  "ease-arrive": { c:"cubic-bezier(.34,1.3,.64,1)",  d:"Gentle overshoot. The gift box lid and the main coin." },
  "ease-pop":    { c:"cubic-bezier(.4,1.75,.3,1)",   d:"Strong overshoot. The success circle scaling from nothing." },
  "ease-trim":   { c:"cubic-bezier(.45,1.45,.8,1)",  d:"Path drawing. The success check stroking on." },
  "ease-beat":   { c:"cubic-bezier(.5,0,.5,1)",      d:"Symmetrical. Both halves of a heartbeat." },
  "ease-expo":   { c:"cubic-bezier(.22,1,.36,1)",    d:"Fast out, long tail. Particles leaving and settling." }
};

</script>
<script>
/* patterns.js — motion for layout elements: lists, surfaces, text, taps.
   Every entry here is valid Qi motion. The framework decides which ones
   apply to a given element at a given stage; nothing invalid is ever offered.

   v = the four dial scores. Amplitude 1-3, Duration 1-4, Character 1-3,
   Choreography 1-3. They add up to the motion volume, 4 quietest to 13
   loudest, which is what gets compared against the stage target. */

window.PAT = {
  "cascade": { name:"Arrive In Sequence", kind:"list",
    plain:"Each item rises 12px and fades in, 60ms after the one above it.",
    tokens:["duration-fast","ease-out","stagger-tight"], ms:200, e:"ease-out", st:60,
    v:{ a:2, d:2, c:2, o:3 },
    dials:{ Amplitude:"Rises 12px, fades 0 to 100%", Duration:"200ms",
            Character:"Ease-out, decelerating into place", Choreography:"Staggered, 60ms apart" },
    tests:{ nat:"", fun:"The offset makes them read as separate items, so people can scan while it is still arriving.",
            exp:"A short offset reads as composure. A long one shows off." } },

  "group-fade": { name:"Arrive Together", kind:"list",
    plain:"The whole group rises 8px and fades in as one block.",
    tokens:["duration-fast","ease-out"], ms:200, e:"ease-out",
    v:{ a:1, d:2, c:2, o:2 },
    dials:{ Amplitude:"Rises 8px, fades 0 to 100%", Duration:"200ms",
            Character:"Ease-out, decelerating into place", Choreography:"One group, moving as one" },
    tests:{ nat:"", fun:"Reads as one object. Right when the card matters more than the rows inside it.",
            exp:"" } },

  "single-rise": { name:"Rise Into Place", kind:"single",
    plain:"Rises 16px and fades from 0 to 100%.",
    tokens:["duration-slow","ease-out"], ms:500, e:"ease-out",
    v:{ a:2, d:4, c:2, o:1 },
    dials:{ Amplitude:"Rises 16px, fades 0 to 100%", Duration:"500ms",
            Character:"Ease-out, decelerating into place", Choreography:"One element, nothing else moving" },
    tests:{ nat:"Slow and decelerating is how something with weight comes to rest.", fun:"",
            exp:"A single element carrying a moment on its own. Slowness reads as composure." } },

  "settle": { name:"Settle Into Place", kind:"single",
    plain:"Scales from 92% past full size to 104%, then eases back to 100%.",
    tokens:["duration-moderate","ease-settle"], ms:300, e:"ease-settle",
    v:{ a:2, d:3, c:3, o:1 },
    dials:{ Amplitude:"Scales 92% to 104% to 100%", Duration:"300ms",
            Character:"Ease-settle, overshoots once then rests", Choreography:"One element on its own" },
    tests:{ nat:"Mimics a physical object settling after being placed.",
            fun:"Confirms something worked at the exact moment of doubt, without a status line.",
            exp:"Reads as a breath released. Reassurance, not celebration." } },

  "quiet-fade": { name:"Fade Up", kind:"single",
    plain:"Fades from 0 to 100% with no movement.",
    tokens:["duration-fast","ease-in-out"], ms:200, e:"ease-in-out",
    v:{ a:1, d:2, c:2, o:1 },
    dials:{ Amplitude:"Fades 0 to 100%, no movement", Duration:"200ms",
            Character:"Ease-in-out, starts and ends on screen", Choreography:"One element on its own" },
    tests:{ nat:"", fun:"", exp:"The quietest way to bring something in. Nothing moves, so nothing pulls the eye." } },

  "stroke-in": { name:"Draw Itself In", kind:"icon",
    plain:"The path draws from 0 to 100% of its length over 300ms.",
    tokens:["duration-moderate","ease-out"], ms:300, e:"ease-out",
    v:{ a:2, d:3, c:2, o:1 },
    dials:{ Amplitude:"Path draws 0 to 100% of its length", Duration:"300ms",
            Character:"Ease-out, decelerating to the end of the stroke", Choreography:"One path, drawn once" },
    tests:{ nat:"Drawing follows the shape, so it reads as being made rather than switched on.",
            fun:"Takes just long enough to be noticed at the moment something completes.", exp:"" } },

  "icon-settle": { name:"Pop Into Place", kind:"icon",
    plain:"Scales from 88% past full size to 106%, then eases back to 100%.",
    tokens:["duration-moderate","ease-settle"], ms:300, e:"ease-settle",
    v:{ a:3, d:3, c:3, o:1 },
    dials:{ Amplitude:"Scales 88% to 106% to 100%", Duration:"300ms",
            Character:"Ease-settle, overshoots once then rests", Choreography:"One element on its own" },
    tests:{ nat:"An object arriving and coming to rest, the way something set down behaves.",
            fun:"", exp:"More personality than a fade, without becoming playful." } },

  "icon-fade": { name:"Fade In", kind:"icon",
    plain:"Fades from 0 to 100% with no movement or scale.",
    tokens:["duration-fast","ease-in-out"], ms:200, e:"ease-in-out",
    v:{ a:1, d:2, c:2, o:1 },
    dials:{ Amplitude:"Fades 0 to 100%", Duration:"200ms",
            Character:"Ease-in-out, starts and ends on screen", Choreography:"One element on its own" },
    tests:{ nat:"", fun:"", exp:"For an icon that supports rather than announces." } },

  "sheet-rise": { name:"Rise From The Bottom", kind:"surface", qi:"drawer-bottom-sheet",
    plain:"Slides up from below the screen edge and stops.",
    tokens:["duration-moderate","ease-out"], ms:300, e:"ease-out",
    v:{ a:3, d:3, c:2, o:2 },
    dials:{ Amplitude:"Enters from below the edge, travels its own height", Duration:"300ms",
            Character:"Ease-out, decelerating into place", Choreography:"Surface and contents move as one" },
    tests:{ nat:"A large surface takes the longer duration, so it reads as having weight.",
            fun:"Says the surface sits on top and can be dismissed back down.", exp:"" } },

  "surface-fade": { name:"Fade In Place", kind:"surface", qi:"surface-fade",
    plain:"Fades in where it already is, no movement.",
    tokens:["duration-moderate","ease-in-out"], ms:300, e:"ease-in-out",
    v:{ a:1, d:3, c:2, o:2 },
    dials:{ Amplitude:"Fades 0 to 100%, no movement", Duration:"300ms",
            Character:"Ease-in-out, starts and ends on screen", Choreography:"Surface and contents move as one" },
    tests:{ nat:"", fun:"For surfaces that interrupt rather than arrive. Dialogs and alerts.", exp:"" } },

  "ambient-loop": { name:"Breathe While Active", kind:"loading",
    plain:"A soft sheen sweeps across it and repeats every 2200ms.",
    tokens:["linear"], ms:2200, e:"linear",
    v:{ a:2, d:2, c:1, o:1 },
    dials:{ Amplitude:"Sheen sweeps the full width", Duration:"2200ms per cycle, repeating",
            Character:"Linear, constant speed", Choreography:"One element at a time" },
    tests:{ nat:"Linear only. Nothing with mass moves at a constant speed, so it reads as non-physical.",
            fun:"Shows what is live now, without claiming to know how long is left.",
            exp:"Keep the cycle slow. Fast reads as frantic." } },

  "progressive-reveal": { name:"Appear Phrase By Phrase", kind:"text",
    plain:"Text arrives one phrase at a time, 200ms each, no movement.",
    tokens:["duration-fast","linear"], ms:200, e:"linear",
    v:{ a:1, d:2, c:1, o:2 },
    dials:{ Amplitude:"Each phrase fades 0 to 100%", Duration:"200ms per phrase",
            Character:"Linear, constant speed", Choreography:"Phrase by phrase, in reading order" },
    tests:{ nat:"", fun:"Matches reading speed and doubles as loading feedback.", exp:"" } },

  "recede": { name:"Fall Back", kind:"leaving",
    plain:"Drops 8px and fades to 40%, 60ms apart.",
    tokens:["duration-fast","ease-in","stagger-tight"], ms:200, e:"ease-in", st:60,
    v:{ a:1, d:2, c:2, o:3 },
    dials:{ Amplitude:"Drops 8px, fades 100% to 40%", Duration:"200ms",
            Character:"Ease-in, accelerating away", Choreography:"Staggered, 60ms apart" },
    tests:{ nat:"Accelerating away is how something leaves. Decelerating would read as arriving.",
            fun:"Moves attention onto what is next without deleting the history.", exp:"" } },

  "dim": { name:"Dim In Place", kind:"leaving",
    plain:"Fades to 40% with no movement.",
    tokens:["duration-fast","ease-in-out"], ms:200, e:"ease-in-out",
    v:{ a:1, d:2, c:2, o:2 },
    dials:{ Amplitude:"Fades 100% to 40%, no movement", Duration:"200ms",
            Character:"Ease-in-out, starts and ends on screen", Choreography:"One group, moving as one" },
    tests:{ nat:"", fun:"Quieter than falling back. Right when the list should stay stable.", exp:"" } },

  "tap-response": { name:"Press Response", kind:"tap",
    plain:"Scales to 97% on finger down, back to 100% on finger up.",
    tokens:["duration-instant","ease-out"], ms:100, e:"ease-out",
    v:{ a:1, d:1, c:2, o:1 },
    dials:{ Amplitude:"Scales 100% to 97%", Duration:"100ms each way",
            Character:"Ease-out, decelerating into place", Choreography:"One element on its own" },
    tests:{ nat:"", fun:"Anything finger-caused. Micro-feedback at the moment of the press.", exp:"" } }
};

</script>
<script>
/* verbs.js — motion for icons.
   Every verb here was measured from an animated icon that already exists in
   the Qi library. The values are not invented: they are what the heart, the
   watch, the target, the coin box, the confetti, the check and the search
   icon actually do.

   Two things these icons establish that layout motion does not:

   1. Icon motion is COMPOUND. The success check pops a circle, then trims a
      path inside it. The watch trims three rings in sequence. A single
      unbroken movement is the exception, not the rule.
   2. Icon motion LOOPS. Every one runs on a 2200ms cycle with the gesture in
      the first half and the rest held still. That hold is what stops a loop
      reading as frantic.

   Fields:

<script>
/* engine.js — all the rules. No model calls happen in this file.
   If you want to change how the plugin decides something, it is in here.
   If you want to change what it decides between, that is in src/data. */

(function () {
"use strict";

var ORDER = ["Welcome","Find","Act","Confirm","Complete"];

/* ---------------------------------------------------------------- curve
   Two parabolas meeting at the trough, easing down to a floor after the
   peak. Generated rather than typed, so adding a stage cannot break the
   shape. Both ends sit high, which is what makes it read as a U. */
var SHAPE = { open:.88, trough:"Find", peak:"Confirm", floor:.82 };

function heights(){
  var ti = ORDER.indexOf(SHAPE.trough), pi = ORDER.indexOf(SHAPE.peak), n = ORDER.length;
  return ORDER.map(function (id, i) {
    if (i <= ti) { var t = ti === 0 ? 0 : i / ti; return SHAPE.open * (1-t) * (1-t); }
    if (i <= pi) { var u = (i-ti) / (pi-ti); return u * u; }
    var v = (i-pi) / Math.max(1, n-1-pi);
    return 1 - (1-SHAPE.floor) * (v*v);
  });
}

/* The curve height, 0 to 1, converted to a motion volume target.
   Volume runs 4 to 13. The constants below map the curve onto the range
   the pattern library actually occupies: quietest pattern 5, loudest 10.
   If you add patterns outside that range, retune these two numbers. */
var VOL_FLOOR = 5, VOL_SPAN = 6;   // library runs 5 (Orbit) to 11 (Pop Then Trim)
function targetFor(stage){
  return Math.round(VOL_FLOOR + heights()[ORDER.indexOf(stage)] * VOL_SPAN);
}

/* -------------------------------------------------------------- volume */
var VOL_MAX = { a:3, d:4, c:3, o:3 };
function volumeOf(p){ return { a:p.v.a, d:p.v.d, c:p.v.c, o:p.v.o, total:p.v.a+p.v.d+p.v.c+p.v.o }; }

/* ----------------------------------------------------------- diagnosis
   Points accumulate per stage. Highest wins. Every rule records why, and
   that reason is what the designer reads. If you add a rule, write the
   reason too. Weights: a name match is 4, strong content evidence is 3-4,
   weaker content evidence is 2. */
function diagnose(fr){
  var ev = [], sc = {}, n = (fr.name||"").toLowerCase();
  ORDER.forEach(function(s){ sc[s] = 0; });
  function add(s,p,w){ sc[s] += p; if (w) ev.push({ s:s, w:w }); }

  if (/welcome|home|intro|start|landing|how can i help/.test(n))
    add("Welcome",4,"The frame name points at an opening.");
  if (/find|search|filter|browse|select|upload|input|compose|receipt|attach|form/.test(n))
    add("Find",4,"The frame name points at searching or entering something.");
  if (/review|choose|book|detail|summary|check|act|option/.test(n))
    add("Act",4,"The frame name points at choosing or reviewing.");
  if (/confirm|success|booked|submitted|approved/.test(n))
    add("Confirm",4,"The frame name points at a confirmation.");
  if (/complete|done|next|thank|track|status/.test(n))
    add("Complete",4,"The frame name points at the journey closing.");
  if (/think|process|load|calculat|waiting/.test(n))
    add("Act",3,"The frame name points at work in progress, which sits inside Act.");

  var tick=false, loop=false, list=false, btns=0, big=false, late=false;
  (fr.els||[]).forEach(function(e){
    if (e.f.completes) tick = true;
    if (e.f.loading) loop = true;
    if (e.sib >= 3) list = true;
    if (e.f.tap) btns++;
    if (e.f.late) late = true;
    if (e.w >= 360 || e.h >= 280) big = true;
    if (e.f.confirms) add("Find",2,"An attachment is being confirmed.");
  });
  if (tick && btns >= 1) add("Confirm",4,"A completion mark sits next to a single primary button.");
  else if (tick)         add("Confirm",2,"There is a completion mark on this frame.");
  if (loop)              add("Act",3,"Something is looping, so work is in progress.");
  if (loop && list)      add("Act",2,"A repeating list next to a loop reads as a progress sequence.");
  if (big && btns>=1 && !tick) add("Find",2,"A large surface with a button reads as input.");
  if (list && !loop && !tick)  add("Act",2,"A repeating list with no loop reads as options to choose from.");
  if (late)              add("Complete",3,"A follow-up link suggests the journey is closing.");

  var best = ORDER[0], top = -1, sec = -1;
  ORDER.forEach(function(k){
    if (sc[k] > top) { sec = top; top = sc[k]; best = k; }
    else if (sc[k] > sec) sec = sc[k];
  });
  /* Confident only when the winner is strong AND clear of the runner-up.
     Below either threshold the plugin asks rather than asserts. */
  return { stage:best, sure: top >= 5 && (top-sec) >= 3, score:top, gap:top-sec,
           evidence: ev.filter(function(e){ return e.s === best; }).map(function(e){ return e.w; }) };
}

/* ------------------------------------------------------------ grouping
   Layers sharing a name stem move together, so they are presented as one
   decision. Four rows called "Detail row" are one entry, not four. */
function groups(fr){
  var out = [], seen = {};
  (fr.els||[]).forEach(function(el){
    var stem = el.n.toLowerCase().replace(/[\s_-]*\d+$/,"").trim();
    if (el.sib >= 2) { if (seen[stem]) return; seen[stem] = 1;
      out.push({ key:stem, label:el.n, count:el.sib, el:el }); }
    else out.push({ key:el.n, label:el.n, count:1, el:el });
  });
  return out;
}

function kindOf(el){
  if (el.f.tap) return "tap";
  if (el.f.loading) return "loading";
  if (el.f.leaves) return "leaving";
  if (el.sib >= 2) return "list";
  if (el.t === "icon") return "icon";
  if (el.w >= 360 || el.h >= 280) return "surface";
  if (el.t === "text") return "text";
  return "single";
}

function libFor(name){
  var L = window.LIB_ICONS;
  for (var i=0;i<L.length;i++) if (L[i].match.test(name)) return L[i];
  return null;
}
function hasStroke(svg){ return /stroke\s*=\s*"(?!none)/.test(svg||""); }
function hasPart(svg, part){
  if (!svg || !part) return false;
  return svg.toLowerCase().indexOf(String(part).toLowerCase()) > -1;
}

/* ------------------------------------------------------------- options
   Icons draw from the verb library, everything else from the patterns.
   Filtered by what the element can actually support, then ordered by how
   close each one sits to what the curve asks for at this stage. */
function optionsFor(g, stage){
  var t = targetFor(stage);
  var el = g.el;

  if (el.t === "icon") {
    var lib = libFor(el.n);
    if (lib) return { lib:lib, ids:[], target:t, icon:true };

    var V = window.VERBS, svg = el.svg || "";
    var ids = Object.keys(V).filter(function(k){
      var vb = V[k];
      var needs = vb.needs ? [].concat(vb.needs) : [];
      if (needs.indexOf("stroke") > -1 && !hasStroke(svg)) return false;
      if (needs.indexOf("second-part") > -1 && (el.parts || 0) < 2) return false;
      if (needs.indexOf("in-progress") > -1 && !el.f.loading) return false;
      /* Some gestures belong to one kind of journey only. Emit and Lift are
         reward motion; using them on a claim is the thing the framework
         exists to prevent. */
      if (vb.onlyIn && vb.onlyIn.indexOf(window.JOURNEY_KIND || "standard") === -1) return false;
      return true;
    });
    ids.sort(function(x,y){
      return Math.abs(volumeOf(V[x]).total - t) - Math.abs(volumeOf(V[y]).total - t);
    });
    return { ids: ids.slice(0,3), target:t, icon:true };
  }

  var P = window.PAT;
  var pids = (window.STAGES[stage].opts[kindOf(el)] || ["quiet-fade"]).slice();
  pids.sort(function(x,y){
    return Math.abs(volumeOf(P[x]).total - t) - Math.abs(volumeOf(P[y]).total - t);
  });
  return { ids:pids, target:t, icon:false };
}

function motionOf(id){ return window.VERBS[id] || window.PAT[id]; }

/* The one motion that stands out. The plugin decides this, it is not a
   control. Nothing stands out at Find or Complete. */
/* The one motion that stands out. The plugin decides this; it is not a
   control. Nothing stands out at Find or Complete. A candidate has to be
   genuinely significant: a completion mark, an icon, or a text layer clearly
   larger than the others. Falling through to "any single element" was how an
   arbitrary line of text ended up leading a Confirmation. */
function mainMotionOf(fr, stage){
  if (stage === "Find" || stage === "Complete") return null;
  var gs = groups(fr), i;

  for (i=0;i<gs.length;i++) if (gs[i].el.f.completes) return gs[i].key;
  if (stage !== "Confirm" && stage !== "Welcome") return null;
  for (i=0;i<gs.length;i++) if (gs[i].el.t === "icon" && gs[i].count === 1) return gs[i].key;

  /* A text layer only counts if it is at least half again the height of the
     next largest text on the frame. Otherwise nothing leads. */
  var texts = gs.filter(function(g){ return g.el.t === "text" && g.count === 1; })
                .sort(function(a,b){ return b.el.h - a.el.h; });
  if (texts.length >= 2 && texts[0].el.h >= texts[1].el.h * 1.5) return texts[0].key;
  if (texts.length === 1 && gs.length > 1) return texts[0].key;
  return null;
}

/* Conditional notes, triggered by what is on this frame. */
function foundOn(fr){
  return (window.FOUND || []).filter(function(r){ return r.test(fr); });
}

/* ------------------------------------------------------------- prompts */
/* Icon prompts list the sequence, because these gestures are compound.
   A single line cannot describe the success check. */
function verbPrompt(vb, g, frameName, isMain){
  var EASt = window.EAS;
  var L = ["Animate " + g.label + " on " + frameName + ".", vb.plain, ""];
  vb.parts.forEach(function (pt) {
    L.push("- " + pt.part + ": " + pt.track.toLowerCase().replace(/_/g, " ")
      + " from " + pt.from + " to " + pt.to
      + ", starting at " + pt.at + "ms over " + pt.ms + "ms, "
      + EASt[pt.e || vb.e].c + " (" + (pt.e || vb.e) + ").");
  });
  L.push("");
  if (vb.loops) L.push("Loop the whole gesture on a " + window.DUR["duration-loop"].ms
    + "ms cycle, holding still for the remainder.");
  if (vb.st) L.push("Offset each part by " + vb.st + "ms (stagger-parts).");
  if (vb.seenIn) L.push("Matches the " + vb.seenIn + " icon already in the Qi library.");
  L.push("Animate inside this icon only. Do not animate the frame or the layers beside it.");
  if (vb.never) L.push(vb.never);
  if (isMain) L.push("This is the main motion on this frame. Nothing else should compete with it.");
  return L.join("\n");
}

function promptFor(id, g, frameName, isMain){
  if (window.VERBS[id]) return verbPrompt(window.VERBS[id], g, frameName, isMain);
  var p = motionOf(id), DURt = window.DUR, EASt = window.EAS;
  var d = p.tokens.filter(function(t){ return DURt[t] && t.indexOf("duration-") === 0; })[0];
  var L = ["Animate " + g.label + (g.count>1 ? " (all "+g.count+")" : "") + " on " + frameName + ".",
           p.plain];
  L.push((p.ms >= 2000 ? "Continuous loop, "+p.ms+"ms per cycle" : p.ms+"ms"+(d?" ("+d+")":""))
    + ", " + EASt[p.e].c + " (" + p.e + ").");
  if (p.st) L.push(p.st + "ms between siblings (stagger-tight).");
  if (p.qi) L.push("Matches the Qi " + p.qi + " transition.");
  L.push("Trigger on this layer only. Do not animate the frame or add a page transition.");
  if (p.never) L.push(p.never);
  if (isMain) L.push("This is the main motion on this frame. Nothing else should compete with it.");
  return L.join(" ");
}

function easingSpec(name){
  var EASt = window.EAS;
  var m = /cubic-bezier\(([^)]+)\)/.exec(EASt[name].c);
  if (!m) return { type: "LINEAR" };
  var n = m[1].split(",").map(Number);
  return { type: "CUSTOM_CUBIC_BEZIER",
           easingFunctionCubicBezier: { x1:n[0], y1:n[1], x2:n[2], y2:n[3] } };
}

/* A verb is a sequence of tracks, so it returns several. Durations in SECONDS. */
function verbKeyframes(vb){
  var total = vb.loops ? window.DUR["duration-loop"].ms
            : vb.parts.reduce(function(m,p){ return Math.max(m, p.at + p.ms); }, 0);
  return {
    compound: true,
    loops: !!vb.loops,
    durationSeconds: total / 1000,
    tracks: vb.parts.map(function (pt) {
      return {
        part: pt.part,
        track: pt.track,
        durationSeconds: pt.ms / 1000,
        keyframes: [
          { timelinePosition: pt.at / 1000, value: pt.from },
          { timelinePosition: (pt.at + pt.ms) / 1000, value: pt.to,
            easing: easingSpec(pt.e || vb.e) }
        ]
      };
    })
  };
}

/* Figma Motion keyframes for a chosen motion. Durations are in SECONDS. */
function keyframesFor(id){
  if (window.VERBS[id]) return verbKeyframes(window.VERBS[id]);
  var p = motionOf(id), EASt = window.EAS;
  var secs = p.ms / 1000;
  var m = /cubic-bezier\(([^)]+)\)/.exec(EASt[p.e].c);
  var ease = m
    ? { type:"CUSTOM_CUBIC_BEZIER", easingFunctionCubicBezier: (function(){
        var n = m[1].split(",").map(Number);
        return { x1:n[0], y1:n[1], x2:n[2], y2:n[3] };
      })() }
    : { type:"LINEAR" };

  var track = window.VERBS[id] ? window.VERBS[id].track : null;
  if (!track) {
    if (/cascade|group-fade|single-rise|sheet-rise/.test(id)) track = "TRANSLATION_Y";
    else if (/settle|tap-response/.test(id)) track = "SCALE";
    else track = "OPACITY";
  }
  var from = 0, to = 0;
  if (track === "TRANSLATION_Y") { from = id === "sheet-rise" ? 320 : id === "single-rise" ? 16 : 12; to = 0; }
  else if (track === "SCALE")    { from = id === "tap-response" ? 0.97 : 0.92; to = 1; }
  else if (track === "ROTATION") { from = -30; to = 0; }
  else                           { from = 0; to = 1; }

  return { compound:false, track:track, durationSeconds:secs, stagger: p.st ? p.st/1000 : 0,
           keyframes:[ { timelinePosition:0, value:from },
                       { timelinePosition:secs, value:to, easing:ease } ] };
}

window.ENGINE = {
  ORDER: ORDER, SHAPE: SHAPE, VOL_MAX: VOL_MAX,
  heights: heights, targetFor: targetFor, volumeOf: volumeOf,
  diagnose: diagnose, groups: groups, kindOf: kindOf,
  optionsFor: optionsFor, motionOf: motionOf, mainMotionOf: mainMotionOf,
  foundOn: foundOn, promptFor: promptFor, keyframesFor: keyframesFor,
  verbKeyframes: verbKeyframes, easingSpec: easingSpec,
  libFor: libFor, hasStroke: hasStroke, hasPart: hasPart
};

})();

</script>
<script>
/* claude.js — the only file in this plugin that calls a model.
   Everything else is rules. If this file were deleted the plugin still
   works; every call below falls back to the deterministic path.

   What is sent:  stage names and descriptions, layer names, sizes, and for
                  icons the exported SVG outline.
   What is not:   text content, images, customer data, anything from
                  outside the selected frame.

   The model may only return values from a closed list. Anything else is
   discarded and the rules run instead. */

(function () {
"use strict";

var MODEL = "claude-haiku-4-5-20251001";   // classification against a fixed list
var URL = "https://api.anthropic.com/v1/messages";

function call(key, body) {
  return fetch(URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": key,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify(Object.assign({ model: MODEL, max_tokens: 700 }, body))
  })
  .then(function (r) { if (!r.ok) throw new Error("status " + r.status); return r.json(); })
  .then(function (d) {
    var text = d.content.filter(function (b) { return b.type === "text"; })
                        .map(function (b) { return b.text; }).join("");
    return JSON.parse(text.replace(/```json|```/g, "").trim());
  });
}

/* ------------------------------------------------------------ stage read
   Used only when the rules are unsure, or when the frame name contradicts
   what is on the frame. Returns one of the five stages, or nothing. */
function readStage(frame, stages, key) {
  var facts = frame.els.map(function (e) {
    var f = [];
    if (e.f.tap) f.push("tappable");
    if (e.f.loading) f.push("looping");
    if (e.f.completes) f.push("completion mark");
    if (e.sib > 1) f.push(e.sib + " siblings");
    return "- " + e.n + " (" + e.t + ", " + e.w + "x" + e.h + (f.length ? ", " + f.join(", ") : "") + ")";
  }).join("\n");

  var prompt = [
    "Decide which stage of a user journey a screen in a mobile insurance app belongs to.",
    "",
    "Stages:",
    Object.keys(stages).map(function (k) { return "- " + k + ": " + stages[k].plain; }).join("\n"),
    "",
    "Frame name: " + frame.name,
    "Layers on it:",
    facts,
    "",
    "The frame name can be misleading. Weigh what is actually on the frame more heavily.",
    "stage must be exactly one of the names above. Do not invent one.",
    "",
    'Return only JSON: {"stage":"Confirm","why":"one short sentence, sentence case, ending in a full stop."}'
  ].join("\n");

  return call(key, { messages: [{ role: "user", content: prompt }] })
    .then(function (r) {
      if (!r || !stages[r.stage]) return null;         // discard anything invented
      return { stage: r.stage, why: String(r.why || "").slice(0, 200) };
    })
    .catch(function () { return null; });
}

/* ------------------------------------------------------------- icon verb
   An icon's motion depends on what it depicts, which cannot be read from
   its size. The model sees the outline and picks one verb from the list.
   It never returns a duration, an easing or a token. */
function readIcon(el, allowedVerbs, verbs, key) {
  if (!el.svg) return Promise.resolve(null);

  var list = allowedVerbs.map(function (v) {
    return "- " + v + ": " + verbs[v].plain;
  }).join("\n");

  var prompt = [
    "Here is the outline of an icon from a mobile insurance app, as SVG.",
    "Layer name: " + el.n,
    "",
    el.svg.slice(0, 4000),
    "",
    "Choose the one motion below that best suits what this icon depicts.",
    list,
    "",
    "Rules:",
    "- verb must be exactly one of the ids above.",
    "- subject must name a part that exists in the SVG, or be empty.",
    "- One unbroken movement, one property. Never combine two.",
    "- Do not give a duration, an easing, or a number of milliseconds.",
    "",
    'Return only JSON: {"verb":"rotate","subject":"the shackle","what":"one short sentence."}'
  ].join("\n");

  return call(key, { messages: [{ role: "user", content: prompt }] })
    .then(function (r) {
      if (!r || allowedVerbs.indexOf(r.verb) === -1) return null;   // not in the list
      var subject = String(r.subject || "");
      if (subject && el.svg.toLowerCase().indexOf(subject.replace(/^the\s+/i, "").toLowerCase()) === -1) {
        subject = "";                                              // named a part that is not there
      }
      return { verb: r.verb, subject: subject, what: String(r.what || "").slice(0, 200) };
    })
    .catch(function () { return null; });
}

/* --------------------------------------------------------------- key test */
function testKey(key) {
  return fetch(URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json", "x-api-key": key,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify({ model: MODEL, max_tokens: 8, messages: [{ role: "user", content: "ping" }] })
  })
  .then(function (r) {
    if (r.status === 401) return { ok: false, msg: "Key was rejected. Check it was copied in full." };
    if (r.status === 429) return { ok: false, msg: "Rate limited. The key works, try again shortly." };
    if (!r.ok) return { ok: false, msg: "Could not reach the API. Status " + r.status + "." };
    return { ok: true, msg: "Connected." };
  })
  .catch(function () { return { ok: false, msg: "No response. Check networkAccess in manifest.json." }; });
}

window.CLAUDE = { readStage: readStage, readIcon: readIcon, testKey: testKey, model: MODEL };

})();

</script>
<script>
/* ui.js — the panel. Views, state, and messaging with code.js.
   Reads everything from window.ENGINE and src/data. It never hardcodes a
   duration, a stage or a motion. */

(function () {
"use strict";

var E = window.ENGINE;
var PAT = window.PAT, VERBS = window.VERBS, STAGES = window.STAGES;
var DUR = window.DUR, EAS = window.EAS, ORDER = E.ORDER;

var ICON_RULE = "Icon motion is judged on Natural first: it should read as the thing behaving, "
  + "not as an effect applied to it. These gestures are compound and looped, matching the "
  + "animated icons already in the Qi library.";

var TESTS = [
  { k:"nat", l:"Natural",    p:"feels real",  n:"Nothing here needs to imitate a physical object." },
  { k:"fun", l:"Functional", p:"does a job",  n:"Not carrying information on its own." },
  { k:"exp", l:"Expressive", p:"right tone",  n:"Neutral by design. Not a focal moment." }
];

var S = {
  view:"empty", prevView:null,
  frame:null, extra:0, reading:false,
  dx:null, changing:false, aiNote:"",
  gi:null, picked:{}, applied:{},
  apiKey:"", keyDraft:"", keyStatus:null, testing:false, report:""
};

/* Verbs describe themselves as a sequence, not as four dial strings. Derive
   the dials so the framework vocabulary still appears on an icon card. */
function dialsOf(p){
  if (p.dials) return p.dials;
  var tracks = {}, maxMs = 0;
  (p.parts || []).forEach(function (pt) {
    tracks[pt.track.toLowerCase().replace(/_/g, " ")] = true;
    maxMs = Math.max(maxMs, pt.ms);
  });
  var amp = Object.keys(tracks).join(", ");
  return {
    Amplitude: amp.charAt(0).toUpperCase() + amp.slice(1),
    Duration: p.loops ? maxMs + "ms, looping every " + DUR["duration-loop"].ms + "ms" : maxMs + "ms",
    Character: EAS[p.e] ? EAS[p.e].c + " (" + p.e + ")" : p.e,
    Choreography: (p.parts && p.parts.length > 1)
      ? p.parts.length + " parts" + (p.st ? ", " + p.st + "ms apart" : ", overlapping")
      : "One element on its own"
  };
}

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function post(m){ parent.postMessage({ pluginMessage:m }, "*"); }
function tokVal(t){ return DUR[t] ? DUR[t].ms+"ms" : EAS[t] ? EAS[t].c : ""; }

/* --------------------------------------------------- messages from code.js */
window.onmessage = function (e) {
  var m = e.data.pluginMessage; if (!m) return;

  if (m.type === "frame") {
    S.frame = m.frame; S.extra = m.extra || 0;
    S.picked = {}; S.applied = {}; S.aiNote = "";
    if (!m.frame) { S.view = "empty"; S.dx = null; }
    else { S.view = "read"; readFrame(); }
    render();
  }
  if (m.type === "key") { S.apiKey = m.key || ""; render(); }
  if (m.type === "scan-report") { S.report = m.text; render(); }
  if (m.type === "applied") {
    if (m.ok && m.key) S.applied[m.key] = m.viaMotion ? "motion" : "note";
    render();
  }
};

/* ------------------------------------------------------------- diagnosis
   Rules first. The model is asked only when the rules are unsure, and it
   can only answer with one of the five stages. */
function readFrame(){
  S.reading = true; render();
  var dx = E.diagnose(S.frame);

  if (dx.sure || !S.apiKey) {
    S.dx = dx; S.reading = false; S.changing = !dx.sure; render(); return;
  }
  window.CLAUDE.readStage(S.frame, STAGES, S.apiKey).then(function (r) {
    if (r) {
      S.dx = { stage:r.stage, sure:true, evidence:[r.why] };
      S.aiNote = "Read by Claude, because the frame name and its layers did not agree.";
    } else {
      S.dx = dx; S.changing = true;
    }
    S.reading = false; render();
  });
}

/* ------------------------------------------------------------- the curve */
function curve(active){
  var W=304,H=72,padX=28,top=10,bot=48, hs=E.heights();
  var pts=ORDER.map(function(id,i){
    return { id:id, x:padX+i*((W-padX-16)/(ORDER.length-1)), y:bot-hs[i]*(bot-top) };
  });
  var n=pts.length,h=[],d=[],i;
  for(i=0;i<n-1;i++){ h[i]=pts[i+1].x-pts[i].x; d[i]=(pts[i+1].y-pts[i].y)/h[i]; }
  var m=[d[0]];
  for(i=1;i<n-1;i++){
    if(d[i-1]*d[i]<=0) m[i]=0;
    else { var w1=2*h[i]+h[i-1], w2=h[i]+2*h[i-1]; m[i]=(w1+w2)/(w1/d[i-1]+w2/d[i]); }
  }
  m[n-1]=d[n-2];
  var p="M"+pts[0].x.toFixed(1)+" "+pts[0].y.toFixed(1);
  for(i=0;i<n-1;i++){
    p+=" C"+(pts[i].x+h[i]/3).toFixed(1)+" "+(pts[i].y+m[i]*h[i]/3).toFixed(1)
      +","+(pts[i+1].x-h[i]/3).toFixed(1)+" "+(pts[i+1].y-m[i+1]*h[i]/3).toFixed(1)
      +","+pts[i+1].x.toFixed(1)+" "+pts[i+1].y.toFixed(1);
  }
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto" role="img" '
    +'aria-label="Where this moment sits across a journey, peaking at Confirm">'
    +'<path d="'+p+'" fill="none" stroke="var(--line-2)" stroke-width="1.5"/>'
    +pts.map(function(q){
      var on=q.id===active;
      return '<circle cx="'+q.x+'" cy="'+q.y+'" r="'+(on?5:2.5)+'" fill="'
        +(on?"var(--aia)":"var(--line-2)")+'"/>'
        +'<text x="'+q.x+'" y="'+(bot+16)+'" font-size="8" text-anchor="middle" fill="'
        +(on?"var(--aia)":"var(--ink-3)")+'">'+q.id+'</text>'; }).join("")
    +'</svg>';
}

/* --------------------------------------------------------------- volume */
function volBar(p, target, stageLabel){
  var v=E.volumeOf(p), d=v.total-target, MX=E.VOL_MAX;
  var rows=[["Amplitude",v.a,MX.a],["Duration",v.d,MX.d],["Character",v.c,MX.c],["Choreography",v.o,MX.o]];
  var fit = Math.abs(d)<=1 ? "Sits where the curve asks for this stage."
          : d>1 ? "Louder than "+stageLabel.toLowerCase()+" usually asks for. Valid, but it will stand out."
          : "Quieter than "+stageLabel.toLowerCase()+" usually asks for. Valid, but it may go unnoticed.";
  var pct=function(n){ return (n/13*100).toFixed(1); };
  return '<div class="volwrap">'
    +'<div class="volhead"><span>Motion Volume</span><span>'+v.total+' of 13</span></div>'
    +'<div class="voltotal"><span class="voltotalfill" style="width:'+pct(v.total)+'%"></span>'
    +'<span class="voltarget" style="left:'+pct(target)+'%"></span></div>'
    +'<p class="volfit'+(Math.abs(d)<=1?' ok':'')+'">'+fit+' The curve asks for about '+target+' here.</p>'
    +rows.map(function(r){
      return '<div class="volrow"><span>'+r[0]+'</span>'
        +'<span class="voltrack"><span class="volfill" style="width:'+(r[1]/r[2]*100)+'%"></span></span>'
        +'<span class="volnum">'+r[1]+'</span></div>'; }).join("")
    +'</div>';
}

/* ---------------------------------------------------------------- views */
var V = {};
function render(){
  var b=$("body"), f=$("foot");
  b.scrollTop=0;
  (V[S.view]||V.empty)(b,f);
  var g=$("gear");
  g.style.display = (S.view==="settings") ? "none" : "";
  g.onclick = function(){ if(S.view!=="settings"){ S.prevView=S.view; S.view="settings"; render(); } };
}

V.empty = function(b,f){
  $("ttl").textContent="Delight Motion"; $("stp").textContent="";
  b.innerHTML='<h3>Select A Frame</h3>'
    +'<p class="lede">Pick the moment you want to work on. The plugin reads what is on it, '
    +'says what kind of moment it is, and suggests motion that fits.</p>';
  f.innerHTML='';
};

V.read = function(b,f){
  $("ttl").textContent=esc(S.frame.name); $("stp").textContent="Step 1 of 3";
  if(S.reading){
    b.innerHTML='<h3>Reading The Frame</h3><p class="lede"><span class="spin"></span> '
      +'Looking at what is on it to work out what kind of moment this is.</p>';
    f.innerHTML=''; return;
  }
  var st=STAGES[S.dx.stage];
  b.innerHTML=
    (S.dx.sure
      ? '<div class="diag"><div class="k">This Looks Like</div><h2>'+esc(st.label)+'</h2>'
        +'<p>'+esc(st.plain)+'</p></div>'
      : '<div class="flag warn"><b>Which Moment Is This?</b>'
        +'The frame name and its layers do not point clearly at one stage.</div>')
    + curve(S.dx.stage)
    + '<p class="note" style="text-align:center;margin:2px 0 10px">Where this sits across a journey. '
    + 'Higher means motion here can be more noticeable.</p>'
    + (S.dx.evidence.length
        ? '<div class="sec">Why</div>'+S.dx.evidence.map(function(e){
            return '<p class="evi">'+esc(e)+'</p>'; }).join("") : '')
    + (S.aiNote ? '<p class="note" style="margin-top:8px">'+esc(S.aiNote)+'</p>' : '')
    + (S.extra ? '<p class="note" style="margin-top:8px">'+S.extra
        +' other frame'+(S.extra>1?'s are':' is')+' selected. Only the first is being read.</p>' : '')
    + (S.changing
        ? '<div class="sec">Set The Moment</div><select id="sel">'
          + ORDER.map(function(k){ return '<option value="'+k+'"'+(k===S.dx.stage?' selected':'')+'>'
              +esc(STAGES[k].label)+'</option>'; }).join("")+'</select>'
        : '<p style="text-align:center;margin-top:12px">'
          +'<button class="link" id="ch">Not the right moment?</button></p>');

  if($("ch")) $("ch").onclick=function(){ S.changing=true; render(); };
  if($("sel")) $("sel").onchange=function(e){
    S.dx={ stage:e.target.value, sure:true, evidence:["You set this by hand."] };
    S.aiNote=""; S.picked={}; S.applied={}; render(); };

  f.innerHTML='<button class="primary" style="flex:1" id="nx">Confirm</button>';
  $("nx").onclick=function(){ S.view="rules"; render(); };
};

V.rules = function(b,f){
  var st=STAGES[S.dx.stage];
  var main=E.mainMotionOf(S.frame,S.dx.stage), gs=E.groups(S.frame);
  var mainLabel = main ? gs.filter(function(g){return g.key===main;})[0].label : null;
  var found=E.foundOn(S.frame);

  $("ttl").textContent=esc(st.label); $("stp").textContent="Step 2 of 3";
  b.innerHTML=
    '<div class="stagebar"><span class="k">Reading this as</span><b>'+esc(st.label)+'</b>'
    +'<button class="link" id="ch">Not the right moment?</button></div>'
    +'<h3>What That Means Here</h3>'
    +(st.quiet
      ? '<p class="lede">'+esc(st.quiet)+' That does not mean no motion. It means smaller dials, '
        +'not fewer moving parts.</p>'
      : '<p class="lede">'+esc(st.plain)+'</p>')
    +'<div class="sec">At This Stage</div>'
    +st.can.map(function(r){ return '<div class="rule yes"><span class="ic">&#10003;</span><span><b>'
      +esc(r[0])+'</b><span class="d">'+esc(r[1])+'</span></span></div>'; }).join("")
    +(mainLabel
      ? '<div class="rule yes"><span class="ic">&#10003;</span><span><b>'+esc(mainLabel)
        +' can be the main motion</b><span class="d">One motion stands out per moment. '
        +'Everything else on this frame stays supporting.</span></span></div>'
      : '<div class="rule no"><span class="ic">&#33;</span><span><b>Nothing stands out here</b>'
        +'<span class="d">No single element should lead at this stage.</span></span></div>')
    +st.cannot.map(function(r){ return '<div class="rule no"><span class="ic">&#33;</span><span><b>'
      +esc(r[0])+'</b><span class="d">'+esc(r[1])+'</span></span></div>'; }).join("")
    +(found.length ? '<div class="sec">On This Frame</div>'
      +found.map(function(r){ return '<div class="rule found"><span class="ic">&#8226;</span><span><b>'
        +esc(r.t)+'</b><span class="d">'+esc(r.d)+'</span></span></div>'; }).join("") : '');

  $("ch").onclick=function(){ S.changing=true; S.view="read"; render(); };
  f.innerHTML='<button id="bk">Back</button><button class="primary" style="flex:1" id="nx">Choose Motion</button>';
  $("bk").onclick=function(){ S.view="read"; render(); };
  $("nx").onclick=function(){ S.view="els"; render(); };
};

/* ---- apply, either as real keyframes or as a note ---- */
function applyGroup(g, id, isMain){
  var stage=S.dx.stage;
  var ids=S.frame.els.filter(function(e){
    return e.n.toLowerCase().replace(/[\s_-]*\d+$/,"").trim()===g.key.toLowerCase()
        || e.n===g.label; }).map(function(e){ return e.id; });
  if(!ids.length) ids=[g.el.id];
  var p=E.motionOf(id);
  post({ type:"apply", job:{
    groupKey:g.key, nodeIds:ids, kf:E.keyframesFor(id),
    annotation:{ frameId:S.frame.id, stage:stage,
      main: isMain ? g.label : "",
      items:[{ element:g.label+(g.count>1?" (all "+g.count+")":""),
               motion:p.name, detail:p.plain, tokens:p.tokens.join("  ·  ") }] }
  }});
}

V.els = function(b,f){
  var stage=S.dx.stage, gs=E.groups(S.frame), main=E.mainMotionOf(S.frame,stage);
  $("ttl").textContent=esc(S.frame.name); $("stp").textContent="Step 3 of 3";
  var done=0;

  b.innerHTML='<h3>Choose Motion</h3>'
    +'<p class="lede">Each one already has a suggestion. Apply it, or look at the alternatives first.</p>'
    +gs.map(function(g,i){
      var o=E.optionsFor(g,stage), chosen=S.picked[g.key], applied=S.applied[g.key];
      if(applied) done++;
      var shown = chosen || (o.lib ? null : o.ids[0]);
      var label = o.lib ? o.lib.name : (shown ? E.motionOf(shown).name : "No option");
      var alt = o.lib ? 0 : Math.max(0, o.ids.length-1);
      return '<div class="ecard'+(applied?' done':'')+'">'
        +'<div class="ehead"><span style="flex:1"><span class="nm">'+esc(g.label)
        +(g.count>1?' <span class="note">&times;'+g.count+'</span>':'')
        +(main===g.key?' <span class="pill">Main motion</span>':'')+'</span>'
        +'<span class="st">'+esc(label)
        +(o.lib?' &middot; from the library':chosen?' &middot; your pick':' &middot; suggested')
        +(applied==="note"?' &middot; placed as a note':'')+'</span></span>'
        +(applied?'<span class="pill k">Applied</span>':'')+'</div>'
        +'<div class="eact">'
        +'<button class="mini" data-g="'+i+'">'
        +(o.lib?'See the icon':(alt?'See '+alt+' other'+(alt>1?'s':''):'See details'))+'</button>'
        +'<button class="mini go" data-a="'+i+'">'
        +(applied?'Applied':(o.lib?'Insert':'Apply to canvas'))+'</button>'
        +'</div></div>'; }).join("")
    +'<p class="note" style="margin-top:8px">'+done+' of '+gs.length+' applied.</p>';

  Array.prototype.forEach.call(b.querySelectorAll("[data-g]"),function(x){
    x.onclick=function(){ S.gi=parseInt(x.dataset.g,10); S.view="opts"; render(); };});
  Array.prototype.forEach.call(b.querySelectorAll("[data-a]"),function(x){
    x.onclick=function(){
      var g=gs[parseInt(x.dataset.a,10)], o=E.optionsFor(g,stage);
      if(o.lib){ post({ type:"insert-icon", job:{ groupKey:g.key, key:o.lib.key, nodeIds:[g.el.id] } }); }
      else { if(!S.picked[g.key]) S.picked[g.key]=o.ids[0];
             applyGroup(g, S.picked[g.key], main===g.key); }
      x.textContent="…";
    };});

  var left=gs.length-done;
  f.innerHTML='<button id="bk">Back</button><button class="primary" style="flex:1" id="all"'
    +(left?'':' disabled')+'>'+(left?'Apply the remaining '+left:'All applied')+'</button>';
  $("bk").onclick=function(){ S.view="rules"; render(); };
  if(left) $("all").onclick=function(){
    gs.forEach(function(g){
      if(S.applied[g.key]) return;
      var o=E.optionsFor(g,stage);
      if(o.lib){ post({ type:"insert-icon", job:{ groupKey:g.key, key:o.lib.key, nodeIds:[g.el.id] } }); }
      else { if(!S.picked[g.key]) S.picked[g.key]=o.ids[0];
             applyGroup(g, S.picked[g.key], main===g.key); }
    });
    $("all").textContent="…";
  };
};

V.opts = function(b,f){
  var stage=S.dx.stage, st=STAGES[stage];
  var gs=E.groups(S.frame), g=gs[S.gi], o=E.optionsFor(g,stage);
  var main=E.mainMotionOf(S.frame,stage), isMain = main===g.key;
  $("ttl").textContent=esc(g.label); $("stp").textContent=esc(st.label);

  if(o.lib){
    b.innerHTML='<div class="libcard"><div class="ico"><span class="iconpv" id="ip-lib">'
      +(g.el.svg||"")+'</span></div>'
      +'<div class="t"><b>'+esc(o.lib.name)+'</b><br><code>'+esc(o.lib.key)+'</code></div></div>'
      +'<div class="flag lib"><b>This Already Exists In The Qi Library</b>'+esc(o.lib.note)
      +' Insert the component instead of building it by hand. It carries its own motion, '
      +'so it stays in step if the library changes.</div>'
      +'<p class="note">Nothing to choose here. The library made the decision.</p>';
    if($("ip-lib")) setTimeout(function(){ drawIcon("ip-lib"); },150);
    f.innerHTML='<button id="bk">Back</button><button class="primary" style="flex:1" id="ins">Insert Component</button>';
    $("bk").onclick=function(){ S.view="els"; render(); };
    $("ins").onclick=function(){
      post({ type:"insert-icon", job:{ groupKey:g.key, key:o.lib.key, nodeIds:[g.el.id] } });
      $("ins").textContent="…"; };
    return;
  }

  var ids=o.ids, cur=S.picked[g.key]||ids[0], isIcon=o.icon;
  if(!ids.length){
    b.innerHTML='<p class="lede">No motion fits this element at this stage.</p>';
    f.innerHTML='<button style="flex:1" id="bk">Back</button>';
    $("bk").onclick=function(){ S.view="els"; render(); }; return;
  }

  b.innerHTML=
    (isMain
      ? '<div class="flag main"><b>This Is The Main Motion</b>It is the one thing that stands out '
        +'on this frame, so it can take the strongest option.</div>'
      : main
        ? '<p class="note" style="margin-bottom:10px">'
          +esc(gs.filter(function(x){return x.key===main;})[0].label)
          +' is the main motion on this frame, so these options all stay supporting.</p>'
        : '')
    +'<p class="lede">'+ids.length+' option'+(ids.length>1?'s':'')+' that fit '
    +esc(st.label).toLowerCase()+'. All of them are valid here.</p>'
    +(isIcon?'<p class="note" style="margin:-6px 0 12px">'+esc(ICON_RULE)+'</p>':'')
    +ids.map(function(id,i){
      var p=E.motionOf(id), on=cur===id;
      return '<div class="opt'+(on?' on':'')+'" data-o="'+id+'">'
        +'<div class="opt-h"><span class="nm">'+esc(p.name)+'</span>'
        +(i===0?'<span class="pill">Suggested</span>':'')+'</div>'
        +'<div class="opt-s">'+esc(p.plain)+'</div>'
        +'<div class="pv" id="pv-'+id+'">'+pvDom(id,g)+'</div>'
        +(on?'<div class="opt-b">'
          + volBar(p,o.target,st.label)
          + '<div class="sec" style="margin-top:12px">The Four Dials</div>'
          + Object.keys(dialsOf(p)).map(function(k){
              return '<div class="kv"><span style="color:var(--ink-3)">'+esc(k)+'</span>'
                +'<span style="text-align:right">'+esc(dialsOf(p)[k])+'</span></div>'; }).join("")
          + '<div class="sec">Tokens</div>'
          + p.tokens.map(function(t){
              return '<div class="kv"><code>'+esc(t)+'</code><span>'+tokVal(t)+'</span></div>'; }).join("")
          + (p.qi?'<p class="note" style="margin-top:7px">Matches the Qi <code>'+esc(p.qi)
              +'</code> transition.</p>':'')
          + '<div class="sec">Motion Principles</div>'
          + (isIcon?'<p class="note" style="margin:-2px 0 8px">Natural carries the most weight for an icon.</p>':'')
          + TESTS.map(function(t){
              var val=(p.tests||{})[t.k];
              return '<p style="font-size:10px;line-height:1.55;margin-bottom:6px;color:'
                +(val?'var(--ink-2)':'var(--ink-3)')+'"><b style="color:var(--ink)">'+t.l+'</b> '
                +'<span style="color:var(--ink-3)">'+t.p+'</span><br>'+esc(val||t.n)+'</p>'; }).join("")
          + '<textarea readonly id="ta">'+esc(E.promptFor(id,g,S.frame.name,isMain))+'</textarea>'
          + '<button style="width:100%;margin-top:7px" id="cp">Copy Prompt</button></div>':'')
        +'</div>'; }).join("");

  ids.forEach(function(id){ playPv(id,g); });
  Array.prototype.forEach.call(b.querySelectorAll("[data-o]"),function(x){
    x.onclick=function(){ S.picked[g.key]=x.dataset.o; render(); };});
  if($("cp")) $("cp").onclick=function(ev){ ev.stopPropagation();
    navigator.clipboard.writeText($("ta").value).then(function(){
      $("cp").textContent="Copied"; setTimeout(function(){ $("cp").textContent="Copy Prompt"; },1200);
    }).catch(function(){}); };

  f.innerHTML='<button id="bk">Back</button><button class="primary" style="flex:1" id="ok">Apply '
    +esc(E.motionOf(cur).name)+'</button>';
  $("bk").onclick=function(){ S.view="els"; render(); };
  $("ok").onclick=function(){ S.picked[g.key]=cur; applyGroup(g,cur,isMain);
    $("ok").textContent="…"; setTimeout(function(){ S.view="els"; render(); },500); };
};

/* --------------------------------------------------------------- preview */
function pvDom(id,g){
  if(VERBS[id]) return '<span class="iconpv" id="ip-'+id+'">'+(g.el.svg||"")+'</span>';
  var p=PAT[id], n=(p.kind==="list"||p.kind==="leaving")?4:1, out="";
  for(var i=0;i<n;i++) out+='<div class="'+(n>1?"bar":"sq")+'"></div>';
  return out;
}
function drawIcon(wrapId){
  var w=$(wrapId); if(!w) return;
  var svg=w.querySelector("svg"); if(!svg) return;
  [].slice.call(svg.querySelectorAll("path")).forEach(function(el,i){
    var len=el.getTotalLength?el.getTotalLength():120;
    el.style.transition="none"; el.style.strokeDasharray=len; el.style.strokeDashoffset=len;
    void el.getBoundingClientRect();
    setTimeout(function(){ el.style.transition="stroke-dashoffset 300ms cubic-bezier(0,0,.58,1)";
      el.style.strokeDashoffset=0; }, i*120+80);
  });
  setTimeout(function(){ drawIcon(wrapId); },2600);
}
function playPv(id,g){
  if(VERBS[id]) return playVerb(id);
  var box=$("pv-"+id); if(!box) return;
  var p=PAT[id], d=Math.min(p.ms,900), c=EAS[p.e].c, gap=p.st||0;
  Array.prototype.forEach.call(box.children,function(el,k){
    el.style.transition="none";
    if(id==="settle"){ el.style.transform="scale(.92)"; el.style.opacity="1"; }
    else if(id==="quiet-fade"||id==="surface-fade"||id==="progressive-reveal"){ el.style.transform="none"; el.style.opacity="0"; }
    else if(id==="sheet-rise"){ el.style.transform="translateY(40px)"; el.style.opacity="1"; }
    else if(id==="single-rise"){ el.style.transform="translateY(16px)"; el.style.opacity="0"; }
    else if(id==="tap-response"){ el.style.transform="scale(.97)"; el.style.opacity="1"; }
    else if(id==="ambient-loop"){ el.style.transform="none"; el.style.opacity=".3"; }
    else if(id==="dim"||id==="recede"){ el.style.transform="none"; el.style.opacity="1"; }
    else { el.style.transform="translateY(12px)"; el.style.opacity="0"; }
    void el.offsetWidth;
    setTimeout(function(){
      el.style.transition="transform "+d+"ms "+c+", opacity "+d+"ms "+c;
      if(id==="recede"){ el.style.transform="translateY(8px)"; el.style.opacity=".4"; }
      else if(id==="dim"){ el.style.opacity=".4"; }
      else if(id==="settle"){ el.style.transform="scale(1.04)";
        setTimeout(function(){ el.style.transform="none"; }, d*0.55); }
      else { el.style.transform="none"; el.style.opacity="1"; }
    }, k*(gap||30)+80);
  });
  setTimeout(function(){ playPv(id,g); },2800);
}
function playVerb(id){
  var wrap=$("ip-"+id); if(!wrap) return;
  var vb=VERBS[id], svg=wrap.querySelector("svg"); if(!svg) return;
  var d=Math.min(vb.ms,900), c=EAS[vb.e].c;
  var paths=[].slice.call(svg.querySelectorAll("path,circle,rect,line,polyline"));
  svg.style.transition="none"; svg.style.transform="none"; svg.style.opacity="1"; svg.style.clipPath="none";
  paths.forEach(function(el){ el.style.transition="none"; el.style.strokeDasharray=""; el.style.strokeDashoffset=""; });

  if(id==="draw"){
    paths.forEach(function(el,i){
      var len=el.getTotalLength?el.getTotalLength():120;
      el.style.strokeDasharray=len; el.style.strokeDashoffset=len;
      void el.getBoundingClientRect();
      setTimeout(function(){ el.style.transition="stroke-dashoffset "+d+"ms "+c;
        el.style.strokeDashoffset=0; }, i*90+80); });
  } else if(id==="reveal"){
    svg.style.clipPath="inset(0 100% 0 0)"; void svg.getBoundingClientRect();
    setTimeout(function(){ svg.style.transition="clip-path "+d+"ms "+c; svg.style.clipPath="inset(0 0 0 0)"; },80);
  } else if(id==="rotate"){
    svg.style.transform="rotate(-30deg)"; void svg.getBoundingClientRect();
    setTimeout(function(){ svg.style.transition="transform "+d+"ms "+c; svg.style.transform="rotate(0deg)"; },80);
  } else if(id==="pop"){
    svg.style.transform="scale(.82)"; void svg.getBoundingClientRect();
    setTimeout(function(){ svg.style.transition="transform "+d+"ms "+c; svg.style.transform="scale(1)"; },80);
  } else if(id==="drift"){
    svg.style.transform="translateY(8px)"; svg.style.opacity="0"; void svg.getBoundingClientRect();
    setTimeout(function(){ svg.style.transition="transform "+d+"ms "+c+", opacity "+d+"ms "+c;
      svg.style.transform="none"; svg.style.opacity="1"; },80);
  } else if(id==="swap"){
    svg.style.opacity="1"; void svg.getBoundingClientRect();
    setTimeout(function(){ svg.style.transition="opacity "+d+"ms "+c; svg.style.opacity=".25";
      setTimeout(function(){ svg.style.opacity="1"; }, d); },80);
  } else if(id==="pulse"){
    svg.style.transform="scale(1)"; void svg.getBoundingClientRect();
    setTimeout(function(){ svg.style.transition="transform 1100ms linear"; svg.style.transform="scale(1.06)";
      setTimeout(function(){ svg.style.transform="scale(1)"; },1100); },80);
  } else if(id==="sheen"){
    svg.style.opacity=".3"; void svg.getBoundingClientRect();
    setTimeout(function(){ svg.style.transition="opacity 1100ms linear"; svg.style.opacity="1";
      setTimeout(function(){ svg.style.opacity=".3"; },1100); },80);
  } else {
    svg.style.opacity="0"; void svg.getBoundingClientRect();
    setTimeout(function(){ svg.style.transition="opacity "+d+"ms "+c; svg.style.opacity="1"; },80);
  }
  setTimeout(function(){ playVerb(id); },2800);
}

/* -------------------------------------------------------------- settings */
function maskKey(k){ return k ? k.slice(0,7)+"..."+k.slice(-4) : ""; }

V.settings = function(b,f){
  $("ttl").textContent="Settings"; $("stp").textContent="";
  var has=!!S.apiKey;
  b.innerHTML=
    '<h3>Claude API Key</h3>'
    +'<p class="lede">Optional. With a key, Claude is asked to read a frame when the rules are '
    +'unsure, and to suggest icon motion. Without one, everything still works from the rules.</p>'
    +(has ? '<div class="flag lib"><b>Key Saved</b><code>'+esc(maskKey(S.apiKey))+'</code></div>'
          : '<div class="flag neutral"><b>No Key Saved</b>Running on rules only.</div>')
    +'<p class="q" style="margin-top:12px">'+(has?'Replace key':'Paste your key')+'</p>'
    +'<input id="kf" type="password" placeholder="sk-ant-..." value="'+esc(S.keyDraft)+'" '
    +'class="keyfield" autocomplete="off">'
    +'<div style="display:flex;gap:5px;margin-top:6px">'
    +'<button id="sv" style="flex:1"'+(S.keyDraft?'':' disabled')+'>Save and test</button>'
    +(has?'<button id="rm">Remove</button>':'')+'</div>'
    +(S.testing?'<p class="note" style="margin-top:8px"><span class="spin"></span> Testing the key…</p>':'')
    +(S.keyStatus&&!S.testing
      ? '<div class="flag '+(S.keyStatus.ok?'lib':'warn')+'" style="margin-top:8px">'
        +esc(S.keyStatus.msg)+'</div>':'')
    +'<div class="sec">Where To Get One</div>'
    +'<ol class="steps"><li>Sign in at platform.claude.com</li>'
    +'<li>Open API keys from the menu under your organisation name</li>'
    +'<li>Create key, then copy it. It is only shown once.</li></ol>'
    +'<p class="note" style="margin-top:8px">Separate from a Claude.ai subscription. New accounts get '
    +'free credits, enough for a few thousand reads. Uses '+esc(window.CLAUDE.model)+', the cheapest tier.</p>'
    +'<div class="sec">What Is Sent</div>'
    +'<p class="note">Stage names, layer names and sizes, and for icons the exported outline. '
    +'Never text content, images, or anything outside the selected frame. The key is stored on this '
    +'machine only and is never written into the plugin files.</p>';

  var kf=$("kf");
  kf.oninput=function(){ S.keyDraft=kf.value; S.keyStatus=null; render(); };
  if($("sv")) $("sv").onclick=function(){
    S.testing=true; render();
    var k=S.keyDraft.trim();
    window.CLAUDE.testKey(k).then(function(r){
      S.keyStatus=r; S.testing=false;
      if(r.ok){ S.apiKey=k; S.keyDraft=""; post({ type:"save-key", key:k }); }
      render(); }); };
  if($("rm")) $("rm").onclick=function(){
    S.apiKey=""; S.keyStatus=null; post({ type:"save-key", key:"" }); render(); };

  f.innerHTML='<button id="sc">Scan report</button><button style="flex:1" id="bk">Done</button>';
  $("sc").onclick=function(){ S.report=""; S.view="report"; render(); post({ type:"scan-report" }); };
  $("bk").onclick=function(){ S.view=S.prevView||"empty"; render(); };
};

/* What the plugin actually read off the frame. Paste this anywhere the
   classification looks wrong, so it can be fixed against real data rather
   than guessed at. */
V.report = function(b,f){
  $("ttl").textContent="Scan Report"; $("stp").textContent="";
  b.innerHTML='<h3>What The Plugin Read</h3>'
    +'<p class="lede">Exactly what came back from the selected frame. If an element is '
    +'classified wrongly, this is the evidence to fix it with.</p>'
    +(S.report
      ? '<textarea class="code" id="rp" readonly style="min-height:300px;white-space:pre">'
        +esc(S.report)+'</textarea>'
      : '<p class="lede"><span class="spin"></span> Reading the frame…');
  f.innerHTML='<button id="bk">Back</button>'
    +'<button class="primary" style="flex:1" id="cp"'+(S.report?'':' disabled')+'>Copy report</button>';
  $("bk").onclick=function(){ S.view="settings"; render(); };
  if(S.report) $("cp").onclick=function(){
    var t=$("rp"); t.select();
    navigator.clipboard.writeText(t.value).then(function(){
      $("cp").textContent="Copied"; setTimeout(function(){ $("cp").textContent="Copy report"; },1200);
    }).catch(function(){}); };
};

render();
post({ type:"ready" });

})();

</script>
