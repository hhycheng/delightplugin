<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Delight Motion</title>
<style>
/* ui.css — panel styling. Safe for a designer to edit. */
:root{
  --ink:#1a1a1a; --ink-2:#5c5c5c; --ink-3:#8f8f8f;
  --line:#e6e6e6; --line-2:#cfcfcf;
  --bg:#f5f5f4; --panel:#fff; --sub:#fafaf9;
  --aia:#d31145; --aia-bg:#fdeef2; --aia-line:#f3c3d0;
  --warn:#8a5a00; --warn-bg:#fdf3e0; --warn-line:#f0dcb2;
  --ok:#1f6b3f; --ok-bg:#eef7f1; --ok-line:#c3e0ce;
  --font:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);font-family:var(--font);color:var(--ink);min-height:100vh;
  display:flex;align-items:flex-start;justify-content:center;padding:36px 20px}



.chrome{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);flex:0 0 auto}
.chrome b{font-size:11px;font-weight:600}
.chrome .sp{margin-left:auto;font-size:10px;color:var(--ink-3)}
.body{padding:12px;flex:1 1 auto;overflow-y:auto}
.foot{padding:10px 12px;border-top:1px solid var(--line);display:flex;gap:6px;flex:0 0 auto}

button{font-family:var(--font);font-size:11px;padding:7px 10px;border-radius:6px;
  border:1px solid var(--line-2);background:var(--panel);color:var(--ink);cursor:pointer;text-align:center}
button:hover{background:var(--sub)}
button.primary{background:var(--aia);border-color:var(--aia);color:#fff}
button.primary:hover{opacity:.9}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--aia);outline-offset:2px}
.link{border:0;background:none;color:var(--ink-3);font-size:10px;padding:0;text-decoration:underline}
.link:hover{color:var(--aia);background:none}

h3{font-size:13px;font-weight:600;margin-bottom:3px}
.lede{font-size:11px;color:var(--ink-2);line-height:1.5;margin-bottom:12px}
.note{font-size:10px;color:var(--ink-3);line-height:1.55}
.q{font-size:11.5px;margin-bottom:5px;font-weight:500}
.sec{font-size:9.5px;color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase;
  margin:14px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line)}

select,textarea{width:100%;font-family:var(--font);font-size:11px;border:1px solid var(--line-2);
  border-radius:6px;padding:7px;background:var(--panel);color:var(--ink)}
textarea{resize:vertical;line-height:1.5}
textarea.code{font-family:var(--mono);font-size:9.5px;background:var(--sub);min-height:150px;line-height:1.6}

.opt{width:100%;text-align:left;padding:8px 10px;border:1px solid var(--line-2);border-radius:6px;
  margin-bottom:5px;background:var(--panel);cursor:pointer;font-family:var(--font);font-size:11.5px}
.opt:hover{border-color:var(--ink-3)}
.opt[aria-pressed="true"]{background:var(--aia-bg);border-color:var(--aia);color:var(--aia);font-weight:500}
.opt small{display:block;font-size:10px;color:var(--ink-3);margin-top:2px;font-weight:400}
.opt[aria-pressed="true"] small{color:var(--aia)}

.frow{display:flex;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid var(--line);font-size:11px}
.frow .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow select{width:auto;max-width:96px;font-size:10px;padding:3px 4px;color:var(--ink-2)}
.guess{font-size:9px;color:var(--warn);border:1px solid var(--warn-line);background:var(--warn-bg);
  border-radius:3px;padding:1px 4px;white-space:nowrap}

.kv{display:flex;justify-content:space-between;gap:8px;font-size:10.5px;padding:4px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv code{font-family:var(--mono);font-size:10px}
.new{font-size:8.5px;color:var(--ink-3);border:1px solid var(--line-2);border-radius:3px;padding:0 3px;margin-left:4px}

.flag{border-radius:6px;padding:8px 9px;font-size:10.5px;line-height:1.5;margin-bottom:8px}
.flag.bad{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn)}
.flag.good{background:var(--ok-bg);border:1px solid var(--ok-line);color:var(--ok)}
.flag b{display:block;margin-bottom:2px}
.rec{background:var(--aia-bg);border:1px solid var(--aia-line);border-radius:6px;padding:8px 9px;
  font-size:10.5px;color:var(--aia);line-height:1.5;margin-bottom:10px}

.ann{border:1px solid var(--line-2);border-radius:6px;margin-bottom:8px;overflow:hidden}
.ann-h{display:flex;align-items:flex-start;gap:6px;padding:8px 9px;background:var(--sub);cursor:pointer}
.ann-h .en{flex:1;font-size:11.5px;font-weight:500}
.ann-h .pt{font-size:9.5px;color:var(--aia);white-space:nowrap;padding-top:1px}
.ann-b{padding:9px;border-top:1px solid var(--line);font-size:10.5px;line-height:1.55}
.ann.mute .ann-h .pt{color:var(--ink-3)}
.dial{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:10px;margin-bottom:8px}
.dial span:nth-child(odd){color:var(--ink-3)}

.pvbox{background:var(--sub);border-radius:6px;height:58px;display:flex;align-items:center;
  justify-content:center;gap:5px;overflow:hidden;margin-bottom:8px}
.sq{width:26px;height:26px;border-radius:5px;background:var(--aia)}
.bar{width:8px;height:26px;border-radius:3px;background:var(--aia)}

.spin{width:12px;height:12px;border:2px solid var(--line-2);border-top-color:var(--aia);
  border-radius:50%;display:inline-block;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.lvl{font-size:9px;padding:1px 6px;border-radius:99px;border:1px solid var(--line-2);color:var(--ink-3);white-space:nowrap}
.lvl.peak{background:var(--aia-bg);border-color:var(--aia-line);color:var(--aia)}
.help{background:var(--sub);border-radius:6px;padding:9px;font-size:10px;color:var(--ink-2);
  line-height:1.6;margin-bottom:10px}
.tabs{display:flex;gap:4px;margin-bottom:7px}
.tabs button{flex:1;padding:6px 4px;font-size:10px}

/* --- plugin host layout (was inline in the prototype) --- */
body.plugin-host{background:var(--panel);display:block;padding:0;min-height:0;height:100vh;
  display:flex;flex-direction:column;overflow:hidden}
.chrome button#gear{border:0;background:none;padding:2px 4px;font-size:13px;line-height:1;color:var(--ink-3)}
.chrome button#gear:hover{color:var(--ink)}
.keyfield{width:100%;font-family:var(--mono);font-size:10.5px;border:1px solid var(--line-2);
  border-radius:6px;padding:8px;background:var(--panel);color:var(--ink)}
.flag.neutral{background:var(--sub);border:1px solid var(--line);color:var(--ink-2)}
.flag code{font-family:var(--mono);font-size:10px}
.steps{font-size:10.5px;color:var(--ink-2);line-height:1.7;padding-left:16px}
.chip-code{font-family:var(--mono);font-size:9.5px;border-radius:4px;padding:5px 6px}
.chip-code.ok{border:1px solid var(--ok-line);background:var(--ok-bg);color:var(--ink)}
.chip-code.warn{border:1px solid var(--warn-line);background:var(--warn-bg);color:var(--ink-3)}
.frow input[type=checkbox]{accent-color:var(--aia);width:13px;height:13px}

/* --- motion volume explainer --- */
.dials-x{margin:10px 0 12px;display:flex;flex-direction:column;gap:9px}
.dx-row{display:grid;grid-template-columns:1fr 78px;grid-template-rows:auto auto;
  column-gap:10px;row-gap:2px;align-items:center}
.dx-label{grid-column:1;grid-row:1;font-size:10.5px;color:var(--ink);font-weight:500}
.dx-track{grid-column:2;grid-row:1;height:3px;border-radius:2px;background:var(--line)}
.dx-fill{height:3px;border-radius:2px;background:var(--aia)}
.dx-sub{grid-column:1/-1;grid-row:2;font-size:9.5px;color:var(--ink-3);line-height:1.4}
.help p{font-size:10px;line-height:1.6}
.help b{display:block;color:var(--ink);font-size:10.5px}
/* --- curve tuning note on an annotation --- */
.tuned{font-size:9.5px;color:var(--aia);background:var(--aia-bg);border:1px solid var(--aia-line);
  border-radius:5px;padding:6px 7px;line-height:1.5;margin:0 0 8px}
.tuned b{font-weight:600}
.fixedn{font-size:9.5px;color:var(--ink-3);line-height:1.5;margin:0 0 8px}

</style>
</head>
<body class="plugin-host">
  <div class="chrome">
    <b id="ttl">Delight Motion</b>
    <span class="sp" id="stp"></span>
    <button id="gear" title="Settings" aria-label="Settings">&#9881;</button>
  </div>
  <div class="body" id="body"></div>
  <div class="foot" id="foot"></div>

<script>
/* tokens.js
   Motion token values. Matches the Qi transition skill.
   qi:true  means the value is ratified in Qi.
   qi:false means this framework defines it and Qi has not adopted it yet.
   To change a duration or easing, change it here only. */

window.TOKENS = {
  "stagger-tight":       { ms: 60,  qi: false, use: "Sibling offset only. Never across a vertical hierarchy." },
  "duration-instant":    { ms: 100, qi: true,  use: "Anything finger-caused." },
  "duration-fast":       { ms: 200, qi: true,  use: "Chips, rows, icon swaps." },
  "duration-moderate":   { ms: 300, qi: true,  use: "Half the phone width and up." },
  "duration-slow":       { ms: 500, qi: true,  use: "One element carrying a stage alone." },
  "duration-deliberate": { ms: 700, qi: true,  use: "Not used in any pattern yet." },

  "easing-in-out": { cubic: "cubic-bezier(.42,0,.58,1)",  qi: true,  use: "Qi default. Starts and ends on screen." },
  "easing-out":    { cubic: "cubic-bezier(0,0,.58,1)",    qi: true,  use: "Entrances." },
  "easing-in":     { cubic: "cubic-bezier(.42,0,1,1)",    qi: true,  use: "Exits." },
  "easing-linear": { cubic: "linear",                     qi: true,  use: "Non-physical motion only." },
  "easing-settle": { cubic: "cubic-bezier(.34,1.4,.64,1)", qi: false, use: "Arrival coming to rest. Overshoots once." }
};

</script>
<script>
/* patterns.js
   Motion patterns. Journey-agnostic: nothing here names a screen or a journey.
   To add a pattern, copy a block and change it. Do not touch any .js outside src/data.

   Each pattern needs:
     name     display name
     tokens   token ids from tokens.js
     dials    the four dials, written as concrete values not adjectives
     plain    what happens, start state to end state
     why      one line per motion principle. Leave "" for neutral.
     never    the guardrail. Leave "" if none applies.
*/

window.PATTERNS = {
  "surface-rise": { name:"Surface Rise", tokens:["duration-moderate","easing-out"],
    curve: {
      quiet: { Amplitude:"Enters from below the edge, travels its own height", Duration:"300ms", ms:300 },
      mid:   { Amplitude:"Enters from below the edge, travels its own height", Duration:"300ms", ms:300 },
      peak:  { Amplitude:"Enters from below the edge, travels its own height", Duration:"500ms", ms:500,
               note:"Slower at the peak so the surface lands with weight." } },
    dials:{ Amplitude:"Enters from below the screen edge, travels its own height", Duration:"300ms",
            Character:"Ease-out, decelerating into place", Choreography:"The whole surface and its contents move as one" },
    plain:"Starts fully below the bottom edge, slides up until its top edge reaches its resting position, and stops without bouncing.",
    why:{ nat:"A large surface takes the longer duration, so it reads as having weight.",
          fun:"Sliding says the panel sits on top and can be dismissed back down.", exp:"" },
    never:"Two surfaces of similar size must use the same timing." },

  "cascade": { name:"Cascade", tokens:["duration-fast","easing-out","stagger-tight"],
    curve: {
      quiet: { Amplitude:"Each item rises 8px and fades from 0 to 100%", Duration:"200ms per item",
               Choreography:"Each item starts 40ms after the one above it", ms:200, stagger:40,
               note:"Tighter and shorter, because this stage should not pull focus." },
      mid:   { Amplitude:"Each item rises 12px and fades from 0 to 100%", Duration:"200ms per item",
               Choreography:"Each item starts 60ms after the one above it", ms:200, stagger:60 },
      peak:  { Amplitude:"Each item rises 16px and fades from 0 to 100%", Duration:"300ms per item",
               Choreography:"Each item starts 80ms after the one above it", ms:300, stagger:80,
               note:"Wider offset at the peak so the order of the verdict is legible." } },
    dials:{ Amplitude:"Each item rises 12px and fades from 0 to 100%", Duration:"200ms per item",
            Character:"Ease-out, decelerating into place", Choreography:"Each item starts 60ms after the one above it" },
    plain:"Items start 12px below their resting position at 0% opacity. Each one rises into place and fades in, 60ms apart, top to bottom.",
    why:{ nat:"", fun:"The offset makes them read as separate items, so people can scan while it is still arriving.",
          exp:"A short offset reads as composure. A long one shows off." },
    never:"Only stagger siblings. Never a parent and its children." },

  "settle": { name:"Settle", tokens:["duration-moderate","easing-settle"],
    curve: {
      quiet: { Amplitude:"Scales from 96% to 101% to 100%", Duration:"200ms", ms:200,
               note:"Barely overshoots. At a quiet stage this is acknowledgement, not celebration." },
      mid:   { Amplitude:"Scales from 92% to 104% to 100%", Duration:"300ms", ms:300 },
      peak:  { Amplitude:"Scales from 90% to 106% to 100%", Duration:"300ms", ms:300,
               note:"The fullest overshoot in the system. Once per journey." } },
    dials:{ Amplitude:"Scales from 92% to 104% to 100%", Duration:"300ms",
            Character:"Ease-settle, overshoots once then rests", Choreography:"One element on its own" },
    plain:"Starts at 92% scale, grows past full size to 104%, then eases back to 100%. Opacity stays at 100% throughout.",
    why:{ nat:"Mimics a physical object settling after being placed.",
          fun:"Confirms something worked at the moment of doubt, without a status line.",
          exp:"Reads as a breath released. Reassurance, not celebration." },
    never:"Never on anything that failed. The overshoot reads as pleased." },

  "container-transform": { name:"Container Transform", tokens:["duration-fast","easing-out"],
    curve: {
      quiet: { Amplitude:"Moves and resizes between two fixed positions", Duration:"200ms", ms:200 },
      mid:   { Amplitude:"Moves and resizes between two fixed positions", Duration:"200ms", ms:200 },
      peak:  { Amplitude:"Moves and resizes between two fixed positions", Duration:"300ms", ms:300,
               note:"Slightly slower at the peak so the transformation is followable." } },
    dials:{ Amplitude:"Moves and resizes between two fixed positions", Duration:"200ms",
            Character:"Ease-out, decelerating into place", Choreography:"Container and contents move together" },
    plain:"The element travels from its start position and size to its end position and size in one continuous move. It stays at 100% opacity the entire time.",
    why:{ nat:"Nothing appears from nowhere.",
          fun:"People track it as the same object. Fading out and in says it was replaced.", exp:"" },
    never:"Never fade out and fade in as a shortcut." },

  "single-rise": { name:"Single Rise", tokens:["duration-slow","easing-out"],
    curve: {
      quiet: { Amplitude:"Rises 10px and fades from 0 to 100%", Duration:"300ms", ms:300,
               note:"Shortened. A 500ms rise in a quiet stage reads as lag, not composure." },
      mid:   { Amplitude:"Rises 16px and fades from 0 to 100%", Duration:"500ms", ms:500 },
      peak:  { Amplitude:"Rises 24px and fades from 0 to 100%", Duration:"500ms", ms:500,
               note:"The longest single move in the journey." } },
    dials:{ Amplitude:"Rises 16px and fades from 0 to 100%", Duration:"500ms",
            Character:"Ease-out, decelerating into place", Choreography:"One element, nothing else moving" },
    plain:"Starts 16px below its resting position at 0% opacity, then rises and fades in over half a second while the rest of the screen stays still.",
    why:{ nat:"Slow and decelerating is how something heavy comes to rest.", fun:"",
          exp:"Slow reads as composure. The same timing later in a journey reads as lag." },
    never:"Once per journey only." },

  "tap-response": { name:"Tap Response", tokens:["duration-instant","easing-out"],
    curveFixed: "Never changes with the curve. Response to touch is a constant, not a volume.",
    dials:{ Amplitude:"Scales from 100% to 97% on press, back to 100% on release", Duration:"100ms each way",
            Character:"Ease-out", Choreography:"One element on its own" },
    plain:"On finger down it shrinks to 97%. On finger up it returns to 100%. No opacity change, no movement.",
    why:{ nat:"", fun:"Anything caused by a finger must answer immediately. Delay reads as the app not hearing you.", exp:"" },
    never:"Never slower than 100ms." },

  "progressive-reveal": { name:"Progressive Reveal", tokens:["duration-fast","easing-linear"],
    curveFixed: "Never changes with the curve. Reading speed is not a stylistic choice.",
    dials:{ Amplitude:"Each phrase fades from 0 to 100%, no movement", Duration:"200ms per phrase",
            Character:"Linear, constant speed", Choreography:"Phrase by phrase, in reading order" },
    plain:"Text arrives in phrases, not letters. Each phrase fades in over 200ms with no movement, in the order it would be read.",
    why:{ nat:"", fun:"Matches reading speed and doubles as loading feedback.", exp:"" },
    never:"Never letter by letter." },

  "ambient-loop": { name:"Ambient Loop", tokens:["easing-linear"],
    curveFixed: "Never changes with the curve. Waiting reads the same wherever it happens.",
    dials:{ Amplitude:"A highlight sweeps across the full width", Duration:"2200ms per cycle, repeating",
            Character:"Linear, constant speed", Choreography:"One element at a time" },
    plain:"A soft highlight travels from the left edge to the right edge of the active item and repeats. Nothing moves position or changes size.",
    why:{ nat:"Linear only. Nothing with weight moves at a constant speed.",
          fun:"Shows what is live now, without claiming to know how long is left.",
          exp:"Keep the cycle slow. Fast reads as frantic." },
    never:"Never fake progress." },

  "stroke-in": { name:"Stroke In", tokens:["duration-moderate","easing-out"],
    curveFixed: "Never changes with the curve. A completion mark is a fact, not a flourish.",
    dials:{ Amplitude:"The path draws from 0% to 100% of its length", Duration:"300ms",
            Character:"Ease-out, decelerating to the end of the stroke", Choreography:"One path, drawn once" },
    plain:"The line starts invisible and draws itself from its start point to its end point over 300ms. Nothing scales or moves.",
    why:{ nat:"Drawing follows the shape, so it reads as being made rather than switched on.",
          fun:"Takes just long enough to be noticed at the moment something completes.", exp:"" },
    never:"" },

  "recede": { name:"Recede", tokens:["duration-fast","easing-in"],
    curve: {
      quiet: { Amplitude:"Drops 6px and fades from 100% to 50%", Duration:"200ms", ms:200 },
      mid:   { Amplitude:"Drops 8px and fades from 100% to 40%", Duration:"200ms", ms:200 },
      peak:  { Amplitude:"Drops 8px and fades from 100% to 40%", Duration:"200ms", ms:200,
               note:"Unchanged at the peak. Things leaving should never compete with the moment." } },
    dials:{ Amplitude:"Drops 8px and fades from 100% to 40%", Duration:"200ms",
            Character:"Ease-in, accelerating away", Choreography:"Each item 60ms after the one before" },
    plain:"Finished items drop 8px and fade to 40% opacity. They stay on screen at reduced weight rather than disappearing.",
    why:{ nat:"Accelerating away is how something leaves.",
          fun:"Moves attention onto what is next without deleting the history.", exp:"" },
    never:"Never remove it entirely if the user might check it." },

  "none": { name:"No Motion", tokens:[],
    dials:{ Amplitude:"None", Duration:"None", Character:"None", Choreography:"None" },
    plain:"This element holds still while the rest of the moment moves.",
    why:{ nat:"", fun:"Stillness is what makes the moving parts readable.",
          exp:"Silence here is deliberate, not an oversight." },
    never:"" }
};

</script>
<script>
/* journeys.js
   One entry per journey. This is the file to edit when adding a new journey.

   h is relative motion volume, 0 to 1. It is relative within this journey only:
   a peak here is not the same loudness as a peak in another journey.

   Shape rule: open moderately high, drop to the quietest point while the user
   is working, rise to a single peak where they commit. No tail after the peak.

   match is optional. Words that suggest a frame belongs to this stage.
   Used when there is no API key, and as a hint to Claude when there is one. */

window.JOURNEYS = {
  assistant: {
    name: "AIA+ AI Assistant",
    stages: [
      { id: "Welcome", h: .74, plain: "The assistant introduces itself",
        match: ["welcome", "how can i help", "entry", "home", "intro", "start"] },
      { id: "Ask",     h: .12, plain: "The user gives information",
        match: ["ask", "compose", "input", "keyboard", "type", "prompt"] },
      { id: "Await",   h: .34, plain: "The system is working",
        match: ["think", "process", "loading", "reason", "search"] },
      { id: "Answer",  h: .58, plain: "The result comes back",
        match: ["answer", "response", "result", "summary", "shortlist", "option"] },
      { id: "Confirm", h: 1,   plain: "The user commits and it is done", lead: true,
        match: ["confirm", "submit", "booked", "success", "complete", "done"] }
    ]
  },

  bookDoctorAI: {
    name: "Find and book a doctor, with AI",
    stages: [
      { id: "Welcome",   h: .74, plain: "The assistant offers to help", 
        match: ["how can i help", "ask ai", "assistant", "entry", "welcome"] },
      { id: "Ask",       h: .12, plain: "The user says what they need",
        match: ["compose", "keyboard", "type", "input", "prompt"] },
      { id: "Await",     h: .34, plain: "The assistant searches and reasons",
        match: ["think", "reason", "locating", "evaluating", "identifying", "searching"] },
      { id: "Shortlist", h: .58, plain: "Doctors come back with a map",
        match: ["shortlist", "doctor", "map", "result", "detail", "book doctor"] },
      { id: "Confirm",   h: 1,   plain: "The appointment is booked", lead: true,
        match: ["booked", "confirm", "consultation", "appointment", "success"] }
    ]
  },

  findDoctorManual: {
    name: "Find and book a doctor, manually",
    stages: [
      { id: "Entry",   h: .68, plain: "The user opens find a doctor",
        match: ["welcome", "home", "healthcare", "quick access", "entry"] },
      { id: "Filter",  h: .12, plain: "The user sets what they are looking for",
        match: ["what are you looking for", "filter", "sorting", "select", "location", "search"] },
      { id: "Results", h: .40, plain: "Doctors are listed and mapped",
        match: ["find doctors", "result", "map", "pre-selected", "list"] },
      { id: "Detail",  h: .56, plain: "The user reads one doctor and picks a slot",
        match: ["doctor details", "book doctor", "visit date", "select the visit"] },
      { id: "Confirm", h: 1,   plain: "The booking is confirmed", lead: true,
        match: ["check and confirm", "you've booked", "booked", "confirm", "success"] }
    ]
  },

  claim: {
    name: "Submit a claim",
    stages: [
      { id: "Start",   h: .66, plain: "The user opens the claim form",
        match: ["start", "home", "claim", "entry"] },
      { id: "Fill",    h: .12, plain: "The user enters details",
        match: ["fill", "form", "input", "details", "enter"] },
      { id: "Upload",  h: .32, plain: "The user attaches documents",
        match: ["upload", "attach", "receipt", "document", "photo"] },
      { id: "Review",  h: .56, plain: "The user checks before sending",

<script>
/* engine.js
   The rules engine. No model calls happen here.

   Two jobs:
     pickPattern(element, stage)  ->  which pattern, and why
     mapByName(frames, journey)   ->  which stage each frame belongs to,
                                       used when there is no API key

   Rule order matters. First match wins. To change behaviour, reorder or edit
   the rules in pickPattern. Every rule returns a `note` explaining itself,
   which is what the designer reads. If you add a rule, write the note too. */

(function () {

  var FRAME_W = 375;   // reference phone width
  var FRAME_H = 812;   // reference phone height

  function iconMatch(name) {
    for (var i = 0; i < window.ANIMATED_ICONS.length; i++) {
      if (window.ANIMATED_ICONS[i].match.test(name)) return window.ANIMATED_ICONS[i];
    }
    return null;
  }

  function pickPattern(el, stage) {
    var f = el.flags || {};
    var quiet = stage.h < .35;
    var wide = el.w / FRAME_W;
    var tall = el.h / FRAME_H;

    // 1. Never animate money. Silent rule, no lecture in the output.
    if (f.money)
      return { id: "none", note: "Held still so the figures stay steady while the rest of the moment moves." };

    // 2. Finger-caused always answers instantly.
    if (f.tap)
      return { id: "tap-response", note: "Finger-caused, so it answers instantly." };

    // 3. Already animated in the icon library. Use it, do not rebuild it.
    var ic = (el.t === "icon") ? iconMatch(el.n) : null;
    if (ic)
      return { id: f.loading ? "ambient-loop" : "stroke-in", lib: ic,
               note: "An animated icon for this already exists in the library." };

    // 4. Work in progress.
    if (f.loading)
      return { id: "ambient-loop", note: "Shows what is live without guessing how long is left." };
    if (f.streaming)
      return { id: "progressive-reveal", note: "Text arriving at reading speed." };

    // 5. Completion and departure.
    if (f.completes)
      return { id: "stroke-in", note: "Marks the moment something finishes." };
    if (f.leaves)
      return { id: "recede", note: "Moves attention off what is done." };

    // 6. Siblings cascade. Read from how many layers share a name stem.
    if (el.sib >= 2)
      return { id: "cascade", note: el.sib + " layers at this level share a name, so they read as a list." };

    // 7. Size decides whether it is a surface or an element.
    if (wide >= .9 || tall >= .3)
      return { id: "surface-rise", note: "Covers most of the screen, so it enters as a surface." };

    // 8. Confirmations settle.
    if (f.confirms)
      return { id: "settle", note: quiet
        ? "Confirms an upload. Overshoot stays minimal because this stage is quiet."
        : "Confirms an upload at the point of doubt." };

    // 9. One thing alone on a loud stage can take the slow duration.
    if (stage.lead && el.sib === 1 && wide > .5)
      return { id: "single-rise", note: "Carries the peak of the journey on its own." };

    if (f.late)
      return { id: "recede", note: "Arrives last, after the outcome has landed." };

    // 10. Default.
    return { id: "container-transform", note: "Changes form without leaving the screen." };
  }

  /* Which band of the curve this stage sits in. This is what stops every
     recommendation looking the same: the pattern is chosen by the element,
     but its dials are set by where the stage sits. */
  function bandOf(stage) {
    if (stage.lead || stage.h >= .8) return "peak";
    if (stage.h < .35) return "quiet";
    return "mid";
  }

  /* Returns the pattern with its dials resolved for this stage. */
  function resolve(pid, stage) {
    var base = window.PATTERNS[pid];
    var band = bandOf(stage);
    if (!base.curve || !base.curve[band]) {
      return { name: base.name, plain: base.plain, tokens: base.tokens, why: base.why,
               never: base.never, dials: base.dials, band: band,
               tuned: false, tuneNote: base.curveFixed || "", ms: null, stagger: null };
    }
    var c = base.curve[band];
    var dials = {};
    Object.keys(base.dials).forEach(function (k) { dials[k] = (k in c) ? c[k] : base.dials[k]; });
    return { name: base.name, plain: base.plain, tokens: base.tokens, why: base.why,
             never: base.never, dials: dials, band: band,
             tuned: true, tuneNote: c.note || "", ms: c.ms || null, stagger: c.stagger || null };
  }

  function annotate(frame, stage) {
    return frame.els.map(function (el) {
      var r = pickPattern(el, stage);
      return { el: el, pid: r.id, p: resolve(r.id, stage), note: r.note, lib: r.lib || null };
    });
  }

  /* Name matching. Used when there is no API key, and as the fallback
     if a model call fails. Duplicate names are resolved by position. */
  function mapByName(frames, journey) {
    var stages = journey.stages;
    var nameCount = {};
    frames.forEach(function (f) { nameCount[f.name] = (nameCount[f.name] || 0) + 1; });

    return frames.map(function (f, i) {
      var n = f.name.toLowerCase();
      var hit = null;

      // exact stage id in the name wins
      stages.forEach(function (s) {
        if (!hit && n.indexOf(s.id.toLowerCase()) > -1) hit = s;
      });
      // then the journey's own keyword list
      if (!hit) {
        stages.forEach(function (s) {
          if (hit || !s.match) return;
          for (var k = 0; k < s.match.length; k++) {
            if (n.indexOf(s.match[k]) > -1) { hit = s; return; }
          }
        });
      }

      // A name that appears more than once cannot be trusted on its own.
      var repeated = nameCount[f.name] > 1;
      if (hit && !repeated)
        return { i: i, stage: hit.id, sure: true, why: "the frame name matches this stage" };
      if (hit && repeated)
        return { i: i, stage: hit.id, sure: false,
                 why: nameCount[f.name] + " frames share this name, so position was used to break the tie" };

      var g = stages[Math.min(Math.floor(i / frames.length * stages.length), stages.length - 1)];
      return { i: i, stage: g.id, sure: false, why: "guessed from position, the name says nothing" };
    });
  }

  window.ENGINE = {
    bandOf: bandOf,
    resolve: resolve,
    pickPattern: pickPattern,
    annotate: annotate,
    mapByName: mapByName,
    iconMatch: iconMatch
  };

})();

</script>
<script>
/* claude.js
   The only file that calls a model. Everything else is deterministic.

   What is sent:  journey name, stage names and descriptions, frame names.
   What is not:   frame contents, text, images, layer data, customer data.

   If the call fails for any reason, the caller falls back to ENGINE.mapByName
   and the plugin keeps working. */

(function () {

  var MODEL = "claude-haiku-4-5-20251001";  // cheapest tier. This is classification.
  var URL = "https://api.anthropic.com/v1/messages";

  function buildPrompt(frames, journey, remarks) {
    return [
      "Map screens to stages of a journey in a mobile insurance app.",
      "",
      "Journey: " + journey.name,
      remarks ? "What the user is doing: " + remarks : "",
      "",
      "Stages, in order:",
      journey.stages.map(function (s) { return "- " + s.id + ": " + s.plain; }).join("\n"),
      "",
      "Screens, in the order the designer selected them:",
      frames.map(function (f, i) { return i + ". " + f.name; }).join("\n"),
      "",
      "Rules:",
      "- stage must be exactly one of the stage names above. Do not invent stages.",
      "- Several screens can share a stage.",
      "- If more than one screen has the same name, use its position to decide.",
      "- Set sure to false when the name is generic and you inferred from order alone.",
      "",
      'Return only a JSON array, no markdown and no preamble:',
      '[{"i":0,"stage":"Welcome","sure":true,"why":"short reason"}]'
    ].filter(Boolean).join("\n");
  }

  function mapStages(frames, journey, remarks, key) {
    return fetch(URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": key,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({
        model: MODEL,
        max_tokens: 1024,
        messages: [{ role: "user", content: buildPrompt(frames, journey, remarks) }]
      })
    })
    .then(function (r) {
      if (!r.ok) throw new Error("status " + r.status);
      return r.json();
    })
    .then(function (d) {
      var text = d.content
        .filter(function (b) { return b.type === "text"; })
        .map(function (b) { return b.text; })
        .join("");
      var parsed = JSON.parse(text.replace(/```json|```/g, "").trim());

      // Never trust a stage name the journey does not define.
      var valid = {};
      journey.stages.forEach(function (s) { valid[s.id] = true; });
      return parsed
        .filter(function (r) { return valid[r.stage]; })
        .map(function (r) {
          return { i: r.i, stage: r.stage, sure: !!r.sure,
                   why: r.why || "matched by Claude" };
        });
    });
  }

  function testKey(key) {
    return fetch(URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": key,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({ model: MODEL, max_tokens: 8,
        messages: [{ role: "user", content: "ping" }] })
    })
    .then(function (r) {
      if (r.status === 401) return { ok: false, msg: "Key was rejected. Check it was copied in full." };
      if (r.status === 429) return { ok: false, msg: "Rate limited. The key works, try again shortly." };
      if (!r.ok) return { ok: false, msg: "Could not reach the API. Status " + r.status + "." };
      return { ok: true, msg: "Connected." };
    })
    .catch(function () {
      return { ok: false, msg: "No response. Check networkAccess in manifest.json." };
    });
  }

  window.CLAUDE = { mapStages: mapStages, testKey: testKey, model: MODEL };

})();

</script>
<script>
/* ui.js — the panel. Views, state, and messaging with code.js.
   Reads its data from window.PATTERNS, window.TOKENS, window.JOURNEYS,
   window.ANIMATED_ICONS. It never hardcodes a duration, a stage or a pattern. */

(function () {
"use strict";

var S = {
  view: "setup", prevView: null,
  apiKey: "", keyDraft: "", keyStatus: null, testing: false,
  frames: [], excluded: {},
  journey: Object.keys(window.JOURNEYS)[0],
  goals: [], remarks: "",
  map: null, mapping: false, mapMode: "", pending: null,
  stage: null, frameIdx: null, open: {},
  showHelp: false, corrections: 0
};

function $(id) { return document.getElementById(id); }
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
  });
}
function J() { return window.JOURNEYS[S.journey]; }
function stageById(id) {
  var m = J().stages.filter(function (s) { return s.id === id; });
  return m.length ? m[0] : J().stages[0];
}
function activeFrames() {
  return S.frames.filter(function (f, i) { return !S.excluded[i]; });
}
function post(msg) { parent.postMessage({ pluginMessage: msg }, "*"); }

/* ------------------------------------------------ messages from code.js */

window.onmessage = function (e) {
  var m = e.data.pluginMessage;
  if (!m) return;
  if (m.type === "selection") {
    if (S.view === "setup" || !S.map) {
      S.frames = m.frames; S.map = null; S.excluded = {}; render();
    } else {
      S.pending = m.frames;   // stash it; do not tear down a flow in progress
      render();
    }
  }
  if (m.type === "key") { S.apiKey = m.key || ""; render(); }
  if (m.type === "annotated") {
    var cp = $("cp");
    if (cp) {
      cp.textContent = m.ok ? "Placed" : "Could not place";
      setTimeout(function () { if ($("cp")) $("cp").textContent = "Place on canvas"; }, 1600);
    }
  }
};

/* ------------------------------------------------------------- mapping */

function runMapping() {
  var frames = activeFrames();
  S.mapping = true; render();

  function finish(res, mode) {
    S.map = res; S.mapping = false; S.mapMode = mode; render();
  }
  function fallback() {
    finish(window.ENGINE.mapByName(frames, J()), "name");
  }

  if (!S.apiKey) return fallback();

  window.CLAUDE.mapStages(frames, J(), S.remarks, S.apiKey)
    .then(function (res) {
      if (!res || !res.length) return fallback();
      finish(res, "claude");
    })
    .catch(fallback);
}

/* ------------------------------------------------------------ the curve */

function smoothPath(pts) {
  var n = pts.length, i;
  if (n < 2) return "";
  var h = [], d = [];
  for (i = 0; i < n - 1; i++) { h[i] = pts[i + 1].x - pts[i].x; d[i] = (pts[i + 1].y - pts[i].y) / h[i]; }
  var m = [d[0]];
  for (i = 1; i < n - 1; i++) {
    if (d[i - 1] * d[i] <= 0) m[i] = 0;
    else {
      var w1 = 2 * h[i] + h[i - 1], w2 = h[i] + 2 * h[i - 1];
      m[i] = (w1 + w2) / (w1 / d[i - 1] + w2 / d[i]);
    }
  }
  m[n - 1] = d[n - 2];
  var path = "M" + pts[0].x.toFixed(1) + " " + pts[0].y.toFixed(1);
  for (i = 0; i < n - 1; i++) {
    path += " C" + (pts[i].x + h[i] / 3).toFixed(1) + " " + (pts[i].y + m[i] * h[i] / 3).toFixed(1)
          + "," + (pts[i + 1].x - h[i] / 3).toFixed(1) + " " + (pts[i + 1].y - m[i + 1] * h[i] / 3).toFixed(1)
          + "," + pts[i + 1].x.toFixed(1) + " " + pts[i + 1].y.toFixed(1);
  }
  return path;
}

function curveSVG(highlight) {
  var st = J().stages, W = 292, H = 108, padX = 30, top = 16, bot = 78;
  var pts = st.map(function (s, i) {
    return { s: s, x: padX + i * ((W - padX - 12) / Math.max(1, st.length - 1)), y: bot - s.h * (bot - top) };
  });
  var hi = pts.reduce(function (a, b) { return b.s.h > a.s.h ? b : a; });
  var lo = pts.reduce(function (a, b) { return b.s.h < a.s.h ? b : a; });
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto" role="img" '
    + 'aria-label="Motion volume across ' + esc(J().name) + ', peaking at ' + esc(hi.s.id) + '">'
    + '<defs><marker id="ar" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="5" markerHeight="5" orient="auto">'
    + '<path d="M1.5 1.5L6.5 4L1.5 6.5" fill="none" stroke="var(--line-2)" stroke-width="1.2" '
    + 'stroke-linecap="round" stroke-linejoin="round"/></marker></defs>'
    + '<line x1="16" y1="' + bot + '" x2="16" y2="' + (top - 4) + '" stroke="var(--line-2)" marker-end="url(#ar)"/>'
    + '<text x="10" y="' + ((top + bot) / 2) + '" font-size="8" fill="var(--ink-3)" text-anchor="middle" '
    + 'transform="rotate(-90 10 ' + ((top + bot) / 2) + ')">Motion Volume</text>'
    + '<path d="' + smoothPath(pts) + '" fill="none" stroke="var(--line-2)" stroke-width="1.5"/>'
    + '<line x1="' + hi.x + '" y1="' + hi.y + '" x2="' + hi.x + '" y2="' + bot + '" stroke="var(--aia-line)" stroke-dasharray="2 2"/>'
    + '<line x1="' + lo.x + '" y1="' + lo.y + '" x2="' + lo.x + '" y2="' + bot + '" stroke="var(--line-2)" stroke-dasharray="2 2"/>'
    + '<text x="' + hi.x + '" y="' + (hi.y - 6) + '" font-size="8" fill="var(--aia)" text-anchor="middle">Loudest</text>'
    + '<text x="' + lo.x + '" y="' + (lo.y - 6) + '" font-size="8" fill="var(--ink-3)" text-anchor="middle">Quietest</text>'
    + pts.map(function (p) {
        var on = highlight === p.s.id;
        return '<circle cx="' + p.x + '" cy="' + p.y + '" r="' + (on ? 5 : 3) + '" fill="'
          + (on ? "var(--aia)" : p.s.lead ? "var(--aia)" : "var(--ink-3)") + '"/>'
          + '<text x="' + p.x + '" y="' + (bot + 12) + '" font-size="8" text-anchor="middle" fill="'
          + (on ? "var(--aia)" : "var(--ink-3)") + '">' + esc(p.s.id) + '</text>';
      }).join("")
    + '</svg>';
}

/* ------------------------------------------------------------- prompts */

function promptOne(a, frameName) {
  if (a.lib) return "Use " + a.lib.icon + " from the Qi icon library for " + a.el.n
    + " on " + frameName + ". " + a.lib.note + " Do not build this animation by hand.";
  if (a.pid === "none") return "Leave " + a.el.n + " on " + frameName + " unanimated. " + a.note;
  var p = a.p, T = window.TOKENS;
  var d = p.tokens.filter(function (t) { return t.indexOf("duration-") === 0; })[0];
  var e = p.tokens.filter(function (t) { return t.indexOf("easing-") === 0; })[0];
  var ms = p.ms || (d ? T[d].ms : null);
  var L = ["Animate " + a.el.n + " on " + frameName + ".", p.dials.Amplitude + ".",
    (ms ? ms + "ms" : "Continuous loop, 2200ms per cycle") + ", " + (e ? T[e].cubic : "linear") + "."];
  if (p.tokens.indexOf("stagger-tight") > -1) L.push((p.stagger || 60) + "ms between siblings.");
  L.push("Trigger on this layer only. Do not animate the frame.");
  if (p.never) L.push(p.never);
  return L.join(" ");
}

/* --------------------------------------------------------------- views */

var V = {};

function pendingBanner() {
  if (!S.pending) return '';
  return '<div class="flag bad" style="margin-bottom:10px"><b>Selection changed</b>'
    + 'You are still working on the previous journey. '
    + '<button class="link" id="reload">Start again with the new selection</button></div>';
}

function render() {
  var b = $("body"), f = $("foot");
  b.scrollTop = 0;
  V[S.view](b, f);
  if (S.pending && S.view !== "setup" && S.view !== "settings") {
    b.insertAdjacentHTML("afterbegin", pendingBanner());
    var r = $("reload");
    if (r) r.onclick = function () {
      S.frames = S.pending; S.pending = null; S.map = null; S.excluded = {};
      S.stage = null; S.frameIdx = null; S.view = "setup"; render();
    };
  }
  var g = $("gear");
  g.style.display = (S.view === "settings") ? "none" : "";
  g.onclick = function () {
    if (S.view !== "settings") { S.prevView = S.view; S.view = "settings"; render(); }
  };
}

/* ---- setup ---- */
V.setup = function (b, f) {
  $("ttl").textContent = "Delight Motion"; $("stp").textContent = "Setup";
  var live = activeFrames().length;

  if (!S.frames.length) {
    b.innerHTML = '<h3>Select some frames</h3>'
      + '<p class="lede">Select the frames in a journey, in the order the user moves through them. '
      + 'Selecting a section picks up every frame inside it.</p>';
    f.innerHTML = ''; return;
  }

  b.innerHTML =
    '<h3>Set up the journey</h3>'
    + '<p class="lede">' + live + ' of ' + S.frames.length + ' frames included.</p>'
    + '<p class="q">Which journey is this?</p>'
    + '<select id="jr" style="margin-bottom:12px">'
    + Object.keys(window.JOURNEYS).map(function (k) {
        return '<option value="' + k + '"' + (k === S.journey ? ' selected' : '') + '>'
          + esc(window.JOURNEYS[k].name) + '</option>'; }).join("")
    + '</select>'
    + '<p class="q">What is the user doing?</p>'
    + '<textarea id="rm" rows="2" placeholder="Booking a doctor with the AIA assistant">' + esc(S.remarks) + '</textarea>'
    + '<p class="note" style="margin-top:4px">One line. Used to match frames to stages.</p>'
    + '<p class="q" style="margin-top:12px">How should someone feel at the end?</p>'
    + '<p class="note" style="margin-bottom:6px">Pick as many as apply.</p>'
    + window.GOALS.map(function (g) {
        return '<button class="opt" data-g="' + g.v + '" aria-pressed="' + (S.goals.indexOf(g.v) > -1) + '">'
          + esc(g.l) + '<small>' + esc(g.sub) + '</small></button>'; }).join("")
    + '<div class="sec">Frames in this journey</div>'
    + '<p class="note" style="margin-bottom:6px">Uncheck anything that is not a step: '
    + 'filter panels, component variants, alternate branches.</p>'
    + S.frames.map(function (fr, i) {
        return '<div class="frow"><label style="flex:1;display:flex;gap:7px;align-items:center;cursor:pointer">'
          + '<input type="checkbox" data-x="' + i + '"' + (S.excluded[i] ? '' : ' checked') + '>'
          + '<span class="nm"' + (S.excluded[i] ? ' style="color:var(--ink-3);text-decoration:line-through"' : '')
          + ' title="' + esc(fr.name) + '">' + esc(fr.name) + '</span></label>'
          + '<span class="note">' + fr.els.length + '</span></div>'; }).join("");

  Array.prototype.forEach.call(b.querySelectorAll(".opt"), function (o) {
    o.onclick = function () {
      var i = S.goals.indexOf(o.dataset.g);
      if (i > -1) S.goals.splice(i, 1); else S.goals.push(o.dataset.g);
      render();
    };
  });
  Array.prototype.forEach.call(b.querySelectorAll("[data-x]"), function (c) {
    c.onchange = function () { S.excluded[c.dataset.x] = !c.checked; render(); };
  });
  $("jr").onchange = function (e) { S.journey = e.target.value; S.map = null; S.stage = null; };
  $("rm").oninput = function (e) { S.remarks = e.target.value; };

  var ready = S.goals.length && live >= 2;
  f.innerHTML = '<button class="primary" style="flex:1" id="nx"' + (ready ? '' : ' disabled') + '>'
    + (live < 2 ? 'Include at least 2 frames' : 'Map the journey') + '</button>';
  if (ready) $("nx").onclick = function () { S.view = "curve"; runMapping(); };
};

/* ---- curve ---- */
V.curve = function (b, f) {
  $("ttl").textContent = J().name; $("stp").textContent = "Step 1 of 3";
  if (S.mapping) {
    b.innerHTML = '<h3>Mapping your journey</h3><p class="lede"><span class="spin"></span> '
      + (S.apiKey ? 'Claude is reading your frame names and placing each one on a stage.'
                  : 'Matching frame names to stages.') + '</p>';
    f.innerHTML = ''; return;
  }
  var frames = activeFrames();
  var st = J().stages;
  var unsure = S.map.filter(function (m) { return !m.sure; }).length;

  b.innerHTML =
    '<h3>Review the curve</h3>'
    + '<p class="lede">Where each frame sits, and how loud motion should be there. '
    + (S.mapMode === "claude" ? 'Matched by Claude.'
        : 'Matched by name. Add a key in settings for better guesses on unclear names.') + '</p>'
    + curveSVG(null)
    + '<button class="link" id="hp" style="margin:4px 0 8px">'
    + (S.showHelp ? 'Hide' : 'What is Motion Volume?') + '</button>'
    + (S.showHelp ? helpBlock() : '')
    + (unsure ? '<div class="flag bad"><b>' + unsure + ' frame' + (unsure > 1 ? 's' : '')
        + ' not certain</b>Open the dropdown to confirm or change it.</div>' : '')
    + S.map.map(function (m) {
        var fr = frames[m.i];
        if (!fr) return '';
        return '<div class="frow"><span class="nm" title="' + esc(fr.name) + '">' + esc(fr.name) + '</span>'
          + (m.sure ? '' : '<span class="guess" title="' + esc(m.why) + '">Guessed</span>')
          + '<select data-i="' + m.i + '">'
          + st.map(function (s) { return '<option' + (s.id === m.stage ? ' selected' : '') + '>'
              + esc(s.id) + '</option>'; }).join("")
          + '</select></div>'; }).join("")
    + namingHint()
    + (S.corrections ? '<p class="note" style="margin-top:8px">' + S.corrections
        + ' correction' + (S.corrections > 1 ? 's' : '') + ' logged.</p>' : '');

  $("hp").onclick = function () { S.showHelp = !S.showHelp; render(); };
  Array.prototype.forEach.call(b.querySelectorAll("select"), function (sel) {
    function confirmRow() {
      var i = parseInt(sel.dataset.i, 10);
      var rec = S.map.filter(function (m) { return m.i === i; })[0];
      if (rec.stage !== sel.value) S.corrections++;
      rec.stage = sel.value; rec.sure = true; render();
    }
    sel.onchange = confirmRow;
    sel.onblur = confirmRow;
  });

  f.innerHTML = '<button id="bk">Back</button><button class="primary" style="flex:1" id="nx">Confirm map</button>';
  $("bk").onclick = function () { S.view = "setup"; render(); };
  $("nx").onclick = function () { S.view = "stage"; render(); };
};

function helpBlock() {
  var rows = [
    ["Amplitude",    "How much changes: position, size, opacity, rotation", 92],
    ["Duration",     "How long it takes",                                   64],
    ["Character",    "How it speeds up and slows",                          76],
    ["Choreography", "How many things move, and in what order",             50]
  ];
  return '<div class="help">'
    + '<b>Motion Volume</b> is how much a moment moves overall. Four things set it:'
    + '<div class="dials-x">'
    + rows.map(function (r) {
        return '<div class="dx-row">'
          + '<div class="dx-label">' + r[0] + '</div>'
          + '<div class="dx-track"><div class="dx-fill" style="width:' + r[2] + '%"></div></div>'
          + '<div class="dx-sub">' + r[1] + '</div>'
          + '</div>'; }).join("")
    + '</div>'
    + '<p style="margin:0 0 10px">A moment with all four turned up asks for attention. '
    + 'With all four turned down, it does its job and gets out of the way.</p>'
    + '<b>Reading the curve</b>'
    + '<p style="margin:4px 0 10px">Insurance journeys open with a greeting, run quiet while the '
    + 'user is working, then peak once at the point they commit. That shape holds across journeys.</p>'
    + '<p style="margin:0">The heights are relative to this journey only. The peak here is not as '
    + 'loud as the peak in a rewards flow.</p></div>';
}

function namingHint() {
  return '<div class="help" style="margin-top:12px"><b>Frame names decide the mapping</b>'
    + '<div style="display:flex;gap:8px;margin-top:7px">'
    + '<div style="flex:1"><div style="font-size:9px;color:var(--ok);margin-bottom:3px">Works</div>'
    + '<div class="chip-code ok">06 Confirmation</div></div>'
    + '<div style="flex:1"><div style="font-size:9px;color:var(--warn);margin-bottom:3px">Gets guessed</div>'
    + '<div class="chip-code warn">Book doctor</div></div></div>'
    + '<p class="note" style="margin-top:6px">Repeated names are resolved by position, which is '
    + 'often wrong. Number them.</p></div>';
}

/* ---- stage ---- */
V.stage = function (b, f) {
  $("ttl").textContent = J().name; $("stp").textContent = "Step 2 of 3";
  var st = J().stages, frames = activeFrames();
  var lead = st.filter(function (s) { return s.lead; })[0];

  b.innerHTML =
    '<h3>Which stage are you working on?</h3>'
    + '<p class="lede">Motion is generated for every element in that stage.</p>'
    + curveSVG(S.stage)
    + '<div class="rec" style="margin-top:8px">Start with <b>' + esc(lead.id) + '</b>. '
    + 'It is the loudest point in this journey and the one worth getting right first.</div>'
    + st.map(function (s) {
        var mine = S.map.filter(function (m) { return m.stage === s.id; });
        var count = mine.reduce(function (n, m) { return n + (frames[m.i] ? frames[m.i].els.length : 0); }, 0);
        var hi = Math.max.apply(null, st.map(function (x) { return x.h; }));
        var lo = Math.min.apply(null, st.map(function (x) { return x.h; }));
        var lvl = s.h === hi ? 'Loudest' : s.h === lo ? 'Quietest' : 'Building';
        return '<button class="opt" data-s="' + esc(s.id) + '" aria-pressed="' + (S.stage === s.id) + '"'
          + (mine.length ? '' : ' disabled') + '>'
          + '<span style="display:flex;justify-content:space-between;gap:6px">'
          + '<span>' + esc(s.id) + '</span>'
          + '<span class="lvl' + (s.lead ? ' peak' : '') + '">' + lvl + '</span></span>'
          + '<small>' + (mine.length ? mine.length + ' frame' + (mine.length > 1 ? 's' : '') + ', ' + count + ' elements'
              : 'no frames here') + '</small></button>'; }).join("");

  Array.prototype.forEach.call(b.querySelectorAll(".opt"), function (o) {
    if (o.disabled) return;
    o.onclick = function () { S.stage = o.dataset.s; S.frameIdx = null; render(); };
  });
  f.innerHTML = '<button id="bk">Back</button><button class="primary" style="flex:1" id="nx"'
    + (S.stage ? '' : ' disabled') + '>Generate motion</button>';
  $("bk").onclick = function () { S.view = "curve"; render(); };
  if (S.stage) $("nx").onclick = function () {
    var mine = S.map.filter(function (m) { return m.stage === S.stage; });
    S.frameIdx = mine[0].i; S.open = {}; S.view = "out"; render();
  };
};

/* ---- output ---- */
var TESTS = [
  { k: "nat", l: "Natural",    p: "feels real",  n: "Nothing here needs to imitate a physical object." },
  { k: "fun", l: "Functional", p: "does a job",  n: "Not carrying information on its own." },
  { k: "exp", l: "Expressive", p: "right tone",  n: "Neutral by design. Not a focal moment." }
];

V.out = function (b, f) {
  var st = stageById(S.stage), frames = activeFrames();
  var mine = S.map.filter(function (m) { return m.stage === S.stage; });
  var fr = frames[S.frameIdx];
  $("ttl").textContent = S.stage; $("stp").textContent = "Step 3 of 3";
  if (!fr) {
    b.innerHTML = '<h3>That frame is no longer in the selection</h3>'
      + '<p class="lede">Go back and pick a stage again.</p>';
    f.innerHTML = '<button style="flex:1" id="bk">Back</button>';
    $("bk").onclick = function () { S.view = "stage"; render(); };
    return;
  }
  var anns = window.ENGINE.annotate(fr, st);
  var moving = anns.filter(function (a) { return a.pid !== "none"; }).length;
  var T = window.TOKENS;

  b.innerHTML =
    (mine.length > 1
      ? '<div style="display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap">'
        + mine.map(function (m) {
            return '<button data-f="' + m.i + '" class="' + (m.i === S.frameIdx ? 'primary' : '') + '" '
              + 'style="font-size:10px;padding:5px 8px">' + esc(frames[m.i].name) + '</button>'; }).join("")
        + '</div>' : '')
    + '<h3>' + esc(fr.name) + '</h3>'
    + '<p class="lede">' + moving + ' of ' + anns.length + ' elements move. ' + esc(st.plain)
    + ', so this stage stays ' + (st.lead ? 'at the peak' : 'quiet') + '.</p>'
    + '<p class="note" style="margin-bottom:8px">Open an element to see its spec and copy its prompt.</p>'
    + anns.map(function (a, i) {
        var open = !!S.open[i], p = a.p;
        var stag = p.tokens.indexOf("stagger-tight") > -1;
        return '<div class="ann' + (a.pid === "none" ? ' mute' : '') + '">'
          + '<div class="ann-h" data-o="' + i + '"><span class="en">' + esc(a.el.n) + '</span>'
          + '<span class="pt">' + (a.lib ? 'Use icon' : esc(p.name)) + '</span></div>'
          + (open ? '<div class="ann-b">'
              + (a.lib ? '<div class="flag good" style="margin-bottom:8px"><b>Already in the icon library</b>'
                  + '<code>' + esc(a.lib.icon) + '</code>. ' + esc(a.lib.note) + '</div>' : '')
              + '<p style="color:var(--ink-2);margin-bottom:8px">' + esc(p.plain) + '</p>'
              + '<div class="dial">'
              + Object.keys(p.dials).map(function (k) {
                  return '<span>' + esc(k) + '</span><span>' + esc(p.dials[k]) + '</span>'; }).join("")
              + '</div>'
              + (p.tokens.length ? p.tokens.map(function (t) {
                  var tk = T[t];
                  var shown = (tk.ms && t.indexOf("duration-") === 0 && p.ms) ? p.ms + "ms"
                            : (tk.ms && t === "stagger-tight" && p.stagger) ? p.stagger + "ms"
                            : (tk.ms ? tk.ms + "ms" : tk.cubic);
                  return '<div class="kv"><code>' + esc(t) + '</code><span>' + shown
                    + (tk.qi ? '' : '<span class="new">new</span>') + '</span></div>'; }).join("") : '')
              + '<div class="pvbox" id="pv' + i + '">'
              + Array.apply(null, { length: stag ? 4 : 1 }).map(function () {
                  return '<div class="' + (stag ? "bar" : "sq") + '"></div>'; }).join("")
              + '</div>'
              + '<button class="link" data-p="' + i + '" style="margin-bottom:8px">Play again</button>'
              + '<p class="note" style="margin:0 0 10px">Why this one: ' + esc(a.note) + '</p>'
              + '<div class="sec" style="margin:0 0 6px">Motion Principles</div>'
              + TESTS.map(function (t) {
                  var v = p.why[t.k];
                  return '<p style="font-size:10px;line-height:1.55;margin-bottom:5px;color:'
                    + (v ? 'var(--ink-2)' : 'var(--ink-3)') + '"><b style="color:var(--ink)">' + t.l + '</b> '
                    + '<span style="color:var(--ink-3)">' + t.p + '</span><br>' + esc(v || t.n) + '</p>'; }).join("")
              + '<button data-c="' + i + '" style="width:100%;margin-top:8px">Copy prompt for this element</button>'
              + '</div>' : '')
          + '</div>'; }).join("");

  function play(i) {
    var a = anns[i], p = a.p, box = $("pv" + i);
    if (!box) return;
    var dTok = p.tokens.filter(function (t) { return t.indexOf("duration-") === 0; })[0];
    var eTok = p.tokens.filter(function (t) { return t.indexOf("easing-") === 0; })[0];
    var d = p.ms || (dTok ? T[dTok].ms : 1400);
    var c = eTok ? T[eTok].cubic : "linear";
    var stag = p.tokens.indexOf("stagger-tight") > -1;
    var gap = p.stagger || 60;
    var from = { t: "none", o: "1" };
    if (a.pid === "cascade") from = { t: "translateY(12px)", o: "0" };
    else if (a.pid === "settle") from = { t: "scale(.92)", o: "1", mid: "scale(1.04)" };
    else if (a.pid === "surface-rise") from = { t: "translateY(46px)", o: "1" };
    else if (a.pid === "single-rise") from = { t: "translateY(16px)", o: "0" };
    else if (a.pid === "tap-response") from = { t: "scale(.97)", o: "1" };
    else if (a.pid === "progressive-reveal") from = { t: "none", o: "0" };
    else if (a.pid === "ambient-loop") from = { t: "none", o: ".25" };
    else if (a.pid === "stroke-in") from = { t: "scaleX(0)", o: "1" };
    else if (a.pid === "recede") from = { t: "none", o: "1", to: { t: "translateY(8px)", o: ".4" } };
    else if (a.pid === "container-transform") from = { t: "translateX(-24px) scale(.85)", o: "1" };
    else if (a.pid === "none") from = { t: "none", o: "1", still: true };

    Array.prototype.forEach.call(box.children, function (el, k) {
      el.style.transition = "none";
      el.style.transformOrigin = a.pid === "stroke-in" ? "left center" : "center";
      el.style.transform = from.t; el.style.opacity = from.o;
      void el.offsetWidth;
      if (from.still) return;
      setTimeout(function () {
        el.style.transition = "transform " + d + "ms " + c + ", opacity " + d + "ms " + c;
        if (from.to) { el.style.transform = from.to.t; el.style.opacity = from.to.o; }
        else if (from.mid) {
          el.style.transform = from.mid;
          setTimeout(function () { el.style.transform = "none"; }, d * 0.55);
        } else { el.style.transform = "none"; el.style.opacity = "1"; }
      }, (stag ? k * gap : 0) + 60);
    });
  }

  Array.prototype.forEach.call(b.querySelectorAll("[data-p]"), function (x) {
    x.onclick = function (ev) { ev.stopPropagation(); play(parseInt(x.dataset.p, 10)); };
  });
  Object.keys(S.open).forEach(function (k) {
    if (S.open[k]) setTimeout(function () { play(parseInt(k, 10)); }, 140);
  });
  Array.prototype.forEach.call(b.querySelectorAll("[data-c]"), function (x) {
    x.onclick = function (ev) {
      ev.stopPropagation();
      var a = anns[parseInt(x.dataset.c, 10)];
      navigator.clipboard.writeText(promptOne(a, fr.name)).then(function () {
        x.textContent = "Copied";
        setTimeout(function () { x.textContent = "Copy prompt for this element"; }, 1200);
      }).catch(function () {});
    };
  });
  Array.prototype.forEach.call(b.querySelectorAll("[data-f]"), function (x) {
    x.onclick = function () { S.frameIdx = parseInt(x.dataset.f, 10); S.open = {}; render(); };
  });
  Array.prototype.forEach.call(b.querySelectorAll("[data-o]"), function (x) {
    x.onclick = function () { var i = x.dataset.o; S.open[i] = !S.open[i]; render(); };
  });

  f.innerHTML = '<button id="bk">Back</button><button class="primary" style="flex:1" id="cp">Place on canvas</button>';
  $("bk").onclick = function () { S.view = "stage"; render(); };
  $("cp").onclick = function () {
    post({ type: "annotate", job: {
      frameId: fr.id, stage: S.stage, lead: !!st.lead,
      items: anns.map(function (a) {
        return {
          element: a.el.n,
          pattern: a.lib ? ("Use " + a.lib.icon) : a.p.name,
          detail: a.lib ? a.lib.note : a.p.plain,
          tokens: a.p.tokens.length ? a.p.tokens.join("  ·  ") : ""
        };
      })
    }});
    $("cp").textContent = "Placing…";
  };
};

/* ---- settings ---- */
function maskKey(k) { return k ? k.slice(0, 7) + "..." + k.slice(-4) : ""; }

V.settings = function (b, f) {
  $("ttl").textContent = "Settings"; $("stp").textContent = "";
  var has = !!S.apiKey;
  b.innerHTML =
    '<h3>Claude API key</h3>'
    + '<p class="lede">Optional. With a key, frames are matched to stages by Claude. '
    + 'Without one, they are matched by name.</p>'
    + (has
      ? '<div class="flag good"><b>Key saved</b><code>' + esc(maskKey(S.apiKey)) + '</code></div>'
      : '<div class="flag neutral"><b>No key saved</b>Name matching is on. Everything works, '
        + 'but repeated or generic frame names get guessed.</div>')
    + '<p class="q" style="margin-top:12px">' + (has ? 'Replace key' : 'Paste your key') + '</p>'
    + '<input id="kf" type="password" placeholder="sk-ant-..." value="' + esc(S.keyDraft) + '" '
    + 'class="keyfield" autocomplete="off">'
    + '<div style="display:flex;gap:5px;margin-top:6px">'
    + '<button id="sv" style="flex:1"' + (S.keyDraft ? '' : ' disabled') + '>Save and test</button>'
    + (has ? '<button id="rm">Remove</button>' : '') + '</div>'
    + (S.testing ? '<p class="note" style="margin-top:8px"><span class="spin"></span> Testing the key…</p>' : '')
    + (S.keyStatus && !S.testing
        ? '<div class="flag ' + (S.keyStatus.ok ? 'good' : 'bad') + '" style="margin-top:8px">'
          + esc(S.keyStatus.msg) + '</div>' : '')
    + '<div class="sec">Where to get one</div>'
    + '<ol class="steps"><li>Sign in at platform.claude.com</li>'
    + '<li>Open API keys from the menu under your organisation name</li>'
    + '<li>Create key, then copy it. It is only shown once.</li></ol>'
    + '<p class="note" style="margin-top:8px">Separate from a Claude.ai subscription. '
    + 'New accounts get free credits, enough for a few thousand mappings. Uses '
    + esc(window.CLAUDE.model) + ', the cheapest tier.</p>'
    + '<div class="sec">Where it is stored</div>'
    + '<p class="note">Saved to this machine only, using Figma client storage. Never written into the '
    + 'plugin file and never shared with anyone else who installs it. Only frame names and stage names '
    + 'are sent to the API. Frame contents are not.</p>';

  var kf = $("kf");
  kf.oninput = function () { S.keyDraft = kf.value; S.keyStatus = null; render(); };
  if ($("sv")) $("sv").onclick = function () {
    S.testing = true; render();
    var k = S.keyDraft.trim();
    window.CLAUDE.testKey(k).then(function (r) {
      S.keyStatus = r; S.testing = false;
      if (r.ok) { S.apiKey = k; S.keyDraft = ""; post({ type: "save-key", key: k }); }
      render();
    });
  };
  if ($("rm")) $("rm").onclick = function () {
    S.apiKey = ""; S.keyStatus = null; post({ type: "save-key", key: "" }); render();
  };

  f.innerHTML = '<button style="flex:1" id="bk">Done</button>';
  $("bk").onclick = function () { S.view = S.prevView || "setup"; render(); };
};

render();
post({ type: "ready" });

})();

</script>
</body>
</html>
